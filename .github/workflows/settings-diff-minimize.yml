name: Settings Diff Minimizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  minimize-settings-diff:
    if: github.actor == 'zuhak5'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/problem-2-settings-layout
          fetch-depth: 0

      - name: Restore authoritative base Settings source
        shell: pwsh
        run: git checkout e5c27c377d508eec4e09ed5488dd0e9b577e6560 -- lib/src/features/settings/presentation/settings_screen.dart

      - name: Apply focused Problem 2 geometry changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/src/features/settings/presentation/settings_screen.dart')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'padding: const EdgeInsets.fromLTRB(16, 8, 16, 112),',
              'padding: const EdgeInsetsDirectional.fromSTEB(16, 8, 16, 112),',
          )

          inset = 'horizontal: HkSpacing.space6,'
          if text.count(inset) != 4:
              raise SystemExit(f'Expected four Settings row insets, found {text.count(inset)}')
          text = text.replace(inset, 'horizontal: SettingsRowGrid.contentInset,')

          def add_standalone_tile_grid(title, *, key=None):
              global text
              title_pos = text.index(title)
              tile_pos = text.rfind('ListTile(', 0, title_pos)
              if tile_pos < 0:
                  raise SystemExit(f'ListTile not found for {title}')
              content_pos = text.index('contentPadding: EdgeInsets.zero,', tile_pos, title_pos)
              line_start = text.rfind('\n', 0, content_pos) + 1
              indent = text[line_start:content_pos]
              content_end = text.index('\n', content_pos) + 1
              additions = (
                  f'{indent}minLeadingWidth: SettingsRowGrid.leadingWidth,\n'
                  f'{indent}horizontalTitleGap: SettingsRowGrid.iconToTextGap,\n'
              )
              text = text[:content_end] + additions + text[content_end:]
              if key is not None:
                  title_pos = text.index(title)
                  tile_pos = text.rfind('ListTile(', 0, title_pos)
                  tile_line_end = text.index('\n', tile_pos) + 1
                  tile_indent_start = text.rfind('\n', 0, tile_pos) + 1
                  tile_indent = text[tile_indent_start:tile_pos] + '  '
                  text = (
                      text[:tile_line_end]
                      + f"{tile_indent}key: const ValueKey('{key}'),\n"
                      + text[tile_line_end:]
                  )

          add_standalone_tile_grid('title: Text(context.l10n.privacyChoices),')
          add_standalone_tile_grid('title: Text(context.l10n.adInspector),')
          add_standalone_tile_grid(
              'title: Text(context.l10n.weatherLocation),',
              key='settings-weather-row',
          )

          replace_once(
              '''contentPadding: const EdgeInsets.symmetric(
                                horizontal: HkSpacing.xs,
                              ),
                              leading: const _SettingsTileIcon(''',
              '''contentPadding: EdgeInsets.zero,
                              leading: const _SettingsTileIcon(''',
          )

          preferences_start = text.index(
              '_SettingsSubsectionLabel(label: context.l10n.preferences)'
          )
          preferences_end = text.index(
              '_ReminderSettingsActions(', preferences_start
          )
          segment = text[preferences_start:preferences_end]
          first_switch = 'SwitchListTile(\n                              contentPadding: EdgeInsets.zero,'
          if segment.count(first_switch) < 1:
              raise SystemExit('Representative preferences SwitchListTile not found')
          segment = segment.replace(
              first_switch,
              "SwitchListTile(\n                              key: const ValueKey('settings-alerts-row'),\n                              contentPadding: EdgeInsets.zero,",
              1,
          )

          icon_pattern = re.compile(
              r'(secondary|leading): const Icon\(\s*([A-Za-z0-9_.]+),?\s*\),'
          )
          segment, icon_count = icon_pattern.subn(
              lambda match: (
                  f'{match.group(1)}: const _SettingsPlainIcon('
                  f'icon: {match.group(2)}),'
              ),
              segment,
          )
          if icon_count < 10:
              raise SystemExit(f'Expected preference icons to normalize, found {icon_count}')
          text = text[:preferences_start] + segment + text[preferences_end:]

          replace_once(
              '''trailing: const Icon(
                                        Symbols.chevron_right_rounded,
                                      ),
                                      onTap: notificationPreferences.enabled
                                          ? () => _pickQuietHour(
                                              context,
                                              ref,
                                              notificationPreferences,
                                              start: false,''',
              '''trailing: Icon(
                                        Directionality.of(context) ==
                                                TextDirection.rtl
                                            ? Symbols.chevron_left_rounded
                                            : Symbols.chevron_right_rounded,
                                      ),
                                      onTap: notificationPreferences.enabled
                                          ? () => _pickQuietHour(
                                              context,
                                              ref,
                                              notificationPreferences,
                                              start: false,''',
          )

          marker = 'class _SettingsCardHeader extends StatelessWidget {'
          grid_class = '''class SettingsRowGrid extends StatelessWidget {
            const SettingsRowGrid({required this.child, super.key});

            static const double contentInset = HkSpacing.space20;
            static const double leadingWidth = 40;
            static const double iconToTextGap = HkSpacing.sm;

            final Widget child;

            @override
            Widget build(BuildContext context) {
              return ListTileTheme(
                data: Theme.of(context).listTileTheme.copyWith(
                  minLeadingWidth: leadingWidth,
                  horizontalTitleGap: iconToTextGap,
                ),
                child: child,
              );
            }
          }

          '''
          replace_once(marker, grid_class + marker)

          replace_once(
              '''child: IconTheme(
            data: IconThemeData(color: scheme.primary),
            child: child,
          ),''',
              '''child: SettingsRowGrid(
            child: IconTheme(
              data: IconThemeData(color: scheme.primary),
              child: child,
            ),
          ),''',
          )

          replace_once(
              'this.size = 40,',
              'this.size = SettingsRowGrid.leadingWidth,',
          )

          plain_icon_marker = 'class _SettingsPreferenceDivider extends StatelessWidget {'
          plain_icon_class = '''class _SettingsPlainIcon extends StatelessWidget {
            const _SettingsPlainIcon({required this.icon});

            final IconData icon;

            @override
            Widget build(BuildContext context) {
              return SizedBox.square(
                dimension: SettingsRowGrid.leadingWidth,
                child: Center(child: Icon(icon)),
              );
            }
          }

          '''
          replace_once(plain_icon_marker, plain_icon_class + plain_icon_marker)

          replace_once(
              '''return Divider(
      height: HkSpacing.space4,
      indent: 52,
      endIndent: HkSpacing.xs,
      color: Theme.of(context).colorScheme.outlineVariant
          .withValues(alpha: 0.72),
    );''',
              '''return Padding(
      padding: const EdgeInsetsDirectional.only(
        start: SettingsRowGrid.leadingWidth + SettingsRowGrid.iconToTextGap,
        end: HkSpacing.xs,
      ),
      child: Divider(
        height: HkSpacing.space4,
        color: Theme.of(context).colorScheme.outlineVariant
            .withValues(alpha: 0.72),
      ),
    );''',
          )

          replace_once(
              '''padding: const EdgeInsets.symmetric(
          horizontal: HkSpacing.xs,
          vertical: HkSpacing.sm,
        ),
        child: Column(''',
              '''padding: const EdgeInsets.symmetric(
          vertical: HkSpacing.sm,
        ),
        child: Column(''',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies and generated sources
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build

      - name: Format and validate focused Settings changes
        shell: pwsh
        run: |
          dart format lib/src/features/settings/presentation/settings_screen.dart test/settings_layout_test.dart
          flutter test --no-pub test/settings_layout_test.dart
          flutter test --no-pub --update-goldens --plain-name "production surfaces have stable English and Arabic visual baselines" test/widget_test.dart

      - name: Commit only focused Settings outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Allowed = @(
            "lib/src/features/settings/presentation/settings_screen.dart",
            "test/settings_layout_test.dart",
            "test/goldens/production_settings_en.png",
            "test/goldens/production_settings_ar.png"
          )
          git add -- $Allowed
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No focused changes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Minimize Settings layout diff [settings-minimize]"
          git push origin HEAD:agent/problem-2-settings-layout

# Temporary branch-only helper; removed before final review.
