name: Audit Supabase Advisors

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-advisors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  advisors:
    name: Hosted security and performance advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Query hosted Supabase Advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14

  legacy-actions-history-cleanup:
    name: Purge legacy Actions run names
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Purge legacy Actions run names'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete runs whose stored workflow identity is no longer current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" > /tmp/registry.json
          jq -e '.workflows | length == 7 and all(.state == "active")' /tmp/registry.json >/dev/null

          scan_legacy_runs() {
            : > /tmp/legacy-run-ids
            : > /tmp/legacy-run-details
            page=1
            while :; do
              payload="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100&page=$page")"
              count="$(jq '.workflow_runs | length' <<< "$payload")"
              while IFS=$'\t' read -r run_id workflow_id run_name run_path; do
                expected="$(jq -r --arg id "$workflow_id" '.workflows[] | select((.id|tostring) == $id) | [.name, .path, .state] | @tsv' /tmp/registry.json)"
                if [ -z "$expected" ]; then
                  echo "$run_id" >> /tmp/legacy-run-ids
                  printf '%s\t%s\t%s\t%s\t%s\n' "$run_id" "$workflow_id" "$run_name" "$run_path" 'missing-workflow-id' >> /tmp/legacy-run-details
                  continue
                fi
                IFS=$'\t' read -r expected_name expected_path expected_state <<< "$expected"
                if [ "$expected_state" != "active" ] || [ "$run_name" != "$expected_name" ] || [ "$run_path" != "$expected_path" ]; then
                  echo "$run_id" >> /tmp/legacy-run-ids
                  printf '%s\t%s\t%s\t%s\t%s | %s\n' "$run_id" "$workflow_id" "$run_name" "$run_path" "$expected_name" "$expected_path" >> /tmp/legacy-run-details
                fi
              done < <(jq -r '.workflow_runs[] | [.id, .workflow_id, .name, .path] | @tsv' <<< "$payload")
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
            sort -u /tmp/legacy-run-ids -o /tmp/legacy-run-ids
          }

          deleted=0
          for pass in $(seq 1 10); do
            scan_legacy_runs
            [ ! -s /tmp/legacy-run-ids ] && break
            echo "Pass $pass: deleting $(wc -l < /tmp/legacy-run-ids) legacy-name/path runs"
            cat /tmp/legacy-run-details || true
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              code="$(curl --silent --show-error -o /tmp/delete-response -w '%{http_code}' -X DELETE "${auth[@]}" "$api/actions/runs/$run_id")"
              if [ "$code" = "204" ]; then
                deleted=$((deleted + 1))
              elif [ "$code" = "409" ]; then
                curl --silent --show-error -X POST "${auth[@]}" "$api/actions/runs/$run_id/cancel" >/dev/null || true
              else
                echo "Delete $run_id returned HTTP $code"
                cat /tmp/delete-response || true
              fi
            done < /tmp/legacy-run-ids
            sleep 2
          done

          scan_legacy_runs
          remaining="$(wc -l < /tmp/legacy-run-ids | tr -d ' ')"
          jq -n --arg sha "$GITHUB_SHA" --argjson deleted "$deleted" --argjson remaining "$remaining" \
            --rawfile details /tmp/legacy-run-details \
            '{cleanup_sha:$sha, deleted_legacy_runs:$deleted, remaining_legacy_runs:$remaining, remaining_details:($details | split("\n") | map(select(length > 0)))}' \
            > /tmp/run-snapshot.json

          encoded="$(base64 -w0 /tmp/run-snapshot.json)"
          curl --fail-with-body --silent --show-error -X PUT "${auth[@]}" \
            -H 'Content-Type: application/json' \
            "$api/contents/.actions-run-name-snapshot.json" \
            -d "$(jq -n --arg message 'Write temporary Actions run-name snapshot' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}')" >/dev/null
