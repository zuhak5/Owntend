name: Audit Supabase Advisors

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-advisors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  advisors:
    name: Hosted security and performance advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Query hosted Supabase Advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14

  stale-actions-registry-cleanup:
    name: Publish inactive Actions registry snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish inactive Actions registry snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Purge inactive workflow runs and write snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          canonical_paths=$(cat <<'EOF'
          .github/workflows/audit-supabase-advisors.yml
          .github/workflows/build-play-android.yml
          .github/workflows/build-production-android.yml
          .github/workflows/deploy-download-site.yml
          .github/workflows/deploy-supabase-migrations.yml
          .github/workflows/validate-flutter.yml
          .github/workflows/validate-google-backend.yml
          EOF
          )

          get_registry() {
            curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100"
          }

          get_stale_ids() {
            get_registry > /tmp/registry.json
            : > /tmp/stale-ids
            while IFS=$'\t' read -r workflow_id workflow_state workflow_path; do
              if [ "$workflow_state" != "active" ] || ! printf '%s\n' "$canonical_paths" | grep -Fxq "$workflow_path"; then
                echo "$workflow_id" >> /tmp/stale-ids
              fi
            done < <(jq -r '.workflows[] | [.id, .state, .path] | @tsv' /tmp/registry.json)
            sort -u /tmp/stale-ids -o /tmp/stale-ids
          }

          scan_stale_runs() {
            : > /tmp/stale-run-ids
            page=1
            while :; do
              payload="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100&page=$page")"
              count="$(jq '.workflow_runs | length' <<< "$payload")"
              while IFS=$'\t' read -r run_id workflow_id; do
                if grep -Fxq "$workflow_id" /tmp/stale-ids; then
                  echo "$run_id" >> /tmp/stale-run-ids
                fi
              done < <(jq -r '.workflow_runs[] | [.id, .workflow_id] | @tsv' <<< "$payload")
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
            sort -u /tmp/stale-run-ids -o /tmp/stale-run-ids
          }

          get_stale_ids
          for pass in $(seq 1 10); do
            scan_stale_runs
            [ ! -s /tmp/stale-run-ids ] && break
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              code="$(curl --silent --show-error -o /tmp/delete-response -w '%{http_code}' -X DELETE "${auth[@]}" "$api/actions/runs/$run_id")"
              if [ "$code" = "409" ]; then
                curl --silent --show-error -X POST "${auth[@]}" "$api/actions/runs/$run_id/cancel" >/dev/null || true
              elif [ "$code" != "204" ]; then
                echo "Delete $run_id returned HTTP $code"
                cat /tmp/delete-response || true
              fi
            done < /tmp/stale-run-ids
            sleep 2
          done

          get_stale_ids
          scan_stale_runs
          remaining_runs="$(wc -l < /tmp/stale-run-ids | tr -d ' ')"

          jq --arg sha "$GITHUB_SHA" --argjson remaining "$remaining_runs" --rawfile stale /tmp/stale-ids '
            {
              cleanup_sha: $sha,
              remaining_stale_runs: $remaining,
              stale_workflows: [
                .workflows[]
                | select((.id|tostring) as $id | ($stale | split("\n") | index($id)) != null)
                | {id, state, path, name}
              ],
              active_workflows: [
                .workflows[]
                | select(.state == "active")
                | {id, state, path, name}
              ]
            }
          ' /tmp/registry.json > /tmp/snapshot.json

          encoded="$(base64 -w0 /tmp/snapshot.json)"
          curl --fail-with-body --silent --show-error -X PUT "${auth[@]}" \
            -H 'Content-Type: application/json' \
            "$api/contents/.actions-registry-snapshot.json" \
            -d "$(jq -n --arg message 'Write temporary Actions registry snapshot' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}')" >/dev/null
