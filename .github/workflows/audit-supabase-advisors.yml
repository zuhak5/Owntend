name: Audit Supabase Advisors

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prune-non-main-branches:
    if: >-
      github.repository == 'zuhak5/Owntend' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'tmp-actions-stale-cleanup'
    name: Delete every branch except main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all non-main branch refs and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$REPO" --jq '.default_branch')"
          test "$default_branch" = 'main'
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "${#main_sha}" -eq 40

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort -u
          )

          if [ "${#branches[@]}" -lt 1 ]; then
            echo '::error::Branch enumeration returned no branches.'
            exit 1
          fi

          printf 'Branches before cleanup (%d):\n' "${#branches[@]}"
          printf '  %s\n' "${branches[@]}"

          deleted=0
          for branch in "${branches[@]}"; do
            if [ "$branch" = 'main' ] || [ "$branch" = "$CURRENT_BRANCH" ]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
            deleted=$((deleted + 1))
          done

          # Delete the workflow's own source branch last. The running job is
          # already pinned to its commit and continues after the ref is gone.
          if [ "$CURRENT_BRANCH" != 'main' ]; then
            echo "Deleting cleanup branch last: $CURRENT_BRANCH"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$CURRENT_BRANCH" >/dev/null
            deleted=$((deleted + 1))
          fi

          sleep 2
          mapfile -t remaining < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort -u
          )

          printf 'Branches after cleanup (%d):\n' "${#remaining[@]}"
          printf '  %s\n' "${remaining[@]}"

          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = 'main'
          verified_main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$verified_main_sha" = "$main_sha"

          {
            echo '### Branch cleanup result'
            echo "- Deleted non-main branches: $deleted"
            echo '- Remaining branches: 1'
            echo '- Remaining branch: `main`'
            echo "- Preserved main SHA: \`$verified_main_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
