name: Audit Supabase Advisors

on:
  push:
    branches:
      - tmp-actions-stale-cleanup

permissions:
  contents: read
  actions: write

jobs:
  cleanup-stale-actions-history:
    name: Remove workflow runs absent from main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete runs for workflow files absent from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          allowed="$(mktemp)"
          runs="$(mktemp)"
          remaining="$(mktemp)"

          gh api "repos/$REPO/contents/.github/workflows?ref=main" \
            --jq '.[] | select(.type == "file") | .path' \
            | sort -u > "$allowed"

          # Fail closed if the source-of-truth lookup is incomplete or points
          # anywhere other than the repository's real main workflow directory.
          test -s "$allowed"
          grep -Fxq '.github/workflows/audit-supabase-advisors.yml' "$allowed"

          echo '### Main workflow source of truth' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/' "$allowed" | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .status, .name, .html_url] | @tsv' \
            > "$runs"

          stale_before=0
          deleted=0
          blocked=0

          while IFS=$'\t' read -r run_id run_path run_status run_name run_url; do
            [ -n "$run_id" ] || continue
            normalized_path="${run_path%%@*}"

            if grep -Fxq "$normalized_path" "$allowed"; then
              continue
            fi

            stale_before=$((stale_before + 1))
            echo "Stale run: id=$run_id status=$run_status path=$normalized_path name=$run_name"

            # The cleanup job itself uses a path that exists on main, so this
            # guard should never be needed; retain it as a fail-safe anyway.
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "::error::Refusing to delete the currently executing run $run_id"
              blocked=$((blocked + 1))
              continue
            fi

            if [ "$run_status" != 'completed' ]; then
              gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null || true
              for _ in $(seq 1 30); do
                sleep 2
                run_status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo unknown)"
                [ "$run_status" = 'completed' ] && break
              done
            fi

            if [ "$run_status" != 'completed' ]; then
              echo "::error::Stale run $run_id did not reach completed state (status=$run_status)"
              blocked=$((blocked + 1))
              continue
            fi

            gh api -X DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null
            deleted=$((deleted + 1))
          done < "$runs"

          # Re-query instead of trusting the delete responses. Any remaining
          # run whose workflow path is not in main makes this cleanup fail.
          sleep 2
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .status, .name, .html_url] | @tsv' \
            > "$runs"

          : > "$remaining"
          while IFS=$'\t' read -r run_id run_path run_status run_name run_url; do
            [ -n "$run_id" ] || continue
            normalized_path="${run_path%%@*}"
            if ! grep -Fxq "$normalized_path" "$allowed"; then
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$run_id" "$normalized_path" "$run_status" "$run_name" "$run_url" \
                >> "$remaining"
            fi
          done < "$runs"

          {
            echo
            echo '### Cleanup result'
            echo "- Stale runs found before cleanup: $stale_before"
            echo "- Stale runs deleted: $deleted"
            echo "- Stale runs blocked: $blocked"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$remaining" ]; then
            echo '- Remaining stale runs:' >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r run_id run_path run_status run_name run_url; do
              echo "  - $run_id — \`$run_path\` — $run_status — $run_name" >> "$GITHUB_STEP_SUMMARY"
            done < "$remaining"
            echo '::error::One or more workflow runs still reference files absent from main.'
            cat "$remaining"
            exit 1
          fi

          echo '- Remaining stale runs: 0' >> "$GITHUB_STEP_SUMMARY"
