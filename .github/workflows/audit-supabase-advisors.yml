name: Audit Supabase Advisors

on:
  workflow_dispatch:
  push:
    branches:
      - chore/cleanup-stale-actions-20260820

permissions:
  contents: read

concurrency:
  group: supabase-advisors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup-obsolete-action-runs:
    name: Remove obsolete Actions history
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/cleanup-stale-actions-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete runs whose workflow path is absent from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=main" \
            --jq '.[] | select(.type == "file") | .path' \
            | sort -u > /tmp/keep-workflows.txt

          echo "Canonical workflow paths on main:"
          cat /tmp/keep-workflows.txt

          scan_stale_runs() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .path] | @tsv' \
              | awk 'NF >= 2' \
              | while IFS=$'\t' read -r run_id workflow_path; do
                  if ! grep -Fxq "$workflow_path" /tmp/keep-workflows.txt; then
                    printf '%s\t%s\n' "$run_id" "$workflow_path"
                  fi
                done
          }

          deleted=0
          for pass in $(seq 1 10); do
            scan_stale_runs > /tmp/stale-runs.tsv
            if [ ! -s /tmp/stale-runs.tsv ]; then
              break
            fi

            echo "Pass $pass: $(wc -l < /tmp/stale-runs.tsv | tr -d ' ') stale runs remain"
            while IFS=$'\t' read -r run_id workflow_path; do
              [ -z "$run_id" ] && continue
              echo "Deleting run $run_id from obsolete workflow path: $workflow_path"
              set +e
              response="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" 2>&1)"
              code=$?
              set -e
              if [ "$code" -eq 0 ]; then
                deleted=$((deleted + 1))
                continue
              fi

              if printf '%s' "$response" | grep -q '409'; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
              else
                echo "$response"
              fi
            done < /tmp/stale-runs.tsv

            sleep 2
          done

          scan_stale_runs > /tmp/stale-runs.tsv
          remaining="$(wc -l < /tmp/stale-runs.tsv | tr -d ' ')"
          echo "Deleted at least $deleted obsolete workflow runs."
          echo "Remaining obsolete workflow runs: $remaining"
          if [ "$remaining" -ne 0 ]; then
            cat /tmp/stale-runs.tsv
            exit 1
          fi

  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  advisors:
    name: Hosted security and performance advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Query hosted Supabase Advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14
