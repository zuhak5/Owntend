name: Temporary BUG-004 Remediation

on:
  push:
    branches:
      - fix/bug-004-realtime-delete-reconciliation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/bug-004-realtime-delete-reconciliation

      - name: Apply BUG-004 implementation and regression coverage
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          coordinator_path = Path('lib/src/core/sync/sync_coordinator.dart')
          coordinator = coordinator_path.read_text(encoding='utf-8')

          old_callback = '''        onDelete: (spec, oldRecord) {
                    unawaited(
                      _handleRealtimeDelete(
                        spec: spec,
                        oldRecord: oldRecord,
                        userId: session.userId,
                        deviceId: account.deviceId,
                        scope: scope,
                      ),
                    );
                  },'''
          new_callback = '''        onDelete: (spec, oldRecord) {
                    _runListener(
                      'sync_realtime_delete_reconcile_failed',
                      () => _handleRealtimeDelete(
                        spec: spec,
                        oldRecord: oldRecord,
                        scope: scope,
                      ),
                    );
                  },'''
          if old_callback not in coordinator:
              raise SystemExit('BUG-004 callback anchor not found')
          coordinator = coordinator.replace(old_callback, new_callback, 1)

          old_handler = '''  Future<void> _handleRealtimeDelete({
              required SyncEntitySpec spec,
              required Map<String, dynamic> oldRecord,
              required String userId,
              required String deviceId,
              required _ActiveAccountScope scope,
            }) async {
              if (!_isActiveAccountScope(scope)) return;
              AppLogger.info(
                'sync_realtime_delete_hint',
                fields: {'entity': spec.entity},
              );
              await _localStore.applyRemoteHardDelete(
                spec: spec,
                oldRecord: oldRecord,
                userId: userId,
                deviceId: deviceId,
              );
              _scheduleAutomaticSync(
                delay: Duration.zero,
                targetTables: {spec.remoteTable},
              );
            }'''
          new_handler = '''  Future<void> _handleRealtimeDelete({
              required SyncEntitySpec spec,
              required Map<String, dynamic> oldRecord,
              required _ActiveAccountScope scope,
            }) async {
              if (!_isActiveAccountScope(scope)) return;
              if (spec.scope != SyncScope.catalog &&
                  oldRecord['user_id'] != scope.userId) {
                return;
              }
              if (spec.scope == SyncScope.deviceScoped &&
                  oldRecord['device_id'] != scope.deviceId) {
                return;
              }

              final keyValues = <String, dynamic>{};
              for (final column in spec.keyColumns) {
                final value = oldRecord[spec.remoteColumnFor(column)];
                if (value == null) return;
                keyValues[column] = value;
              }
              final recordKey = spec.keyColumns.isEmpty
                  ? spec.entity
                  : spec.keyColumns.map((column) => keyValues[column]).join('|');

              AppLogger.info(
                'sync_realtime_delete_hint',
                fields: {'entity': spec.entity},
              );
              _scheduleAutomaticSync(
                delay: Duration.zero,
                targetTables: {spec.remoteTable},
              );

              final canonical = await _remoteGateway.fetchRecordByKey(
                spec: spec,
                recordKey: recordKey,
                userId: scope.userId,
              );
              await _ensureActiveAccountScope(scope);

              if (canonical != null) {
                if (canonical.isDeleted) {
                  await _localStore.applyRemoteFeedDelete(canonical);
                } else {
                  await _localStore.applyRemoteFeedRecord(canonical);
                }
                return;
              }

              final now = DateTime.now().toUtc();
              await _localStore.applyRemoteFeedDelete(
                SyncRecord(
                  spec: spec,
                  recordKey: recordKey,
                  values: keyValues,
                  clientModifiedAt: now,
                  originDeviceId: 'realtime-reconcile',
                  deletedAt: now,
                ),
              );
            }'''
          if old_handler not in coordinator:
              raise SystemExit('BUG-004 handler anchor not found')
          coordinator = coordinator.replace(old_handler, new_handler, 1)
          coordinator_path.write_text(coordinator, encoding='utf-8')

          store_path = Path('lib/src/core/sync/local_sync_store.dart')
          store = store_path.read_text(encoding='utf-8')
          start = store.find('  Future<bool> applyRemoteHardDelete({')
          end = store.find('  Future<void> enforceInboxRetention()', start)
          if start < 0 or end < 0:
              raise SystemExit('BUG-004 obsolete hard-delete helper anchor not found')
          store = store[:start] + store[end:]
          store_path.write_text(store, encoding='utf-8')

          test_path = Path('test/sync_coordinator_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          field_anchor = '''  Completer<void>? materializeMediaGate;
            Completer<void>? pullGate;
            Completer<void>? startRealtimeGate;'''
          field_replacement = '''  Completer<void>? materializeMediaGate;
            Completer<void>? pullGate;
            Completer<void>? startRealtimeGate;
            Completer<void>? fetchRecordByKeyGate;
            var fetchRecordByKeyCalls = 0;'''
          if field_anchor not in tests:
              raise SystemExit('BUG-004 gateway field anchor not found')
          tests = tests.replace(field_anchor, field_replacement, 1)

          fetch_anchor = '''  Future<SyncRecord?> fetchRecordByKey({
              required SyncEntitySpec spec,
              required String recordKey,
              required String userId,
            }) async {
              for (final item in _records) {'''
          fetch_replacement = '''  Future<SyncRecord?> fetchRecordByKey({
              required SyncEntitySpec spec,
              required String recordKey,
              required String userId,
            }) async {
              fetchRecordByKeyCalls++;
              await fetchRecordByKeyGate?.future;
              for (final item in _records) {'''
          if fetch_anchor not in tests:
              raise SystemExit('BUG-004 fetchRecordByKey anchor not found')
          tests = tests.replace(fetch_anchor, fetch_replacement, 1)

          final_anchor = '''  );
          }

          Future<void> _seedMaintenancePlanForSync('''
          new_tests = r'''

            test(
              'realtime delete preserves and replays newer pending local intent',
              () async {
                final db = AppDatabase(executor: NativeDatabase.memory());
                addTearDown(db.close);
                final store = LocalSyncStore(db);
                final account = await store.account();
                await store.setEnabled(enabled: true, boundUserId: 'user-1');
                await db.delete(db.syncOutbox).go();
                final auth = _FakeAuthRepository(
                  const AuthSession(userId: 'user-1'),
                );
                addTearDown(auth.controller.close);
                final gateway = _StatefulGateway();
                final coordinator = SyncCoordinator(
                  auth,
                  store,
                  gateway,
                  realtime: gateway,
                );
                addTearDown(coordinator.dispose);
                await _eventually(() async => gateway.onRealtimeDelete != null);

                final spec = syncSpecByEntity['user_setting']!;
                final seeded = await gateway.write(
                  record: SyncRecord(
                    spec: spec,
                    recordKey: 'theme',
                    values: {
                      'key': 'theme',
                      'value': 'light',
                      'updated_at': DateTime.now().toUtc().toIso8601String(),
                    },
                    clientModifiedAt: DateTime.now().toUtc(),
                    originDeviceId: 'peer-device',
                  ),
                  userId: 'user-1',
                  deviceId: 'peer-device',
                  expectedRevision: null,
                );
                await store.applyRemoteFeedRecord(seeded.canonical!);
                await db.delete(db.syncOutbox).go();
                await db.customStatement(
                  "UPDATE settings SET value = 'dark' WHERE key = 'theme'",
                );
                expect(await store.pendingChangedAt('user_setting', 'theme'), isNotNull);

                gateway.hardDelete(
                  userId: 'user-1',
                  spec: spec,
                  recordKey: 'theme',
                );

                await _eventually(() async {
                  final local = await db
                      .customSelect("SELECT value FROM settings WHERE key = 'theme'")
                      .getSingleOrNull();
                  final remote = await gateway.fetch(
                    spec: spec,
                    userId: 'user-1',
                    deviceId: account.deviceId,
                    recordKey: 'theme',
                  );
                  return local?.read<String>('value') == 'dark' &&
                      remote?.values['value'] == 'dark';
                });
              },
            );

            test(
              'stale realtime delete cannot apply after the authenticated account changes',
              () async {
                final db = AppDatabase(executor: NativeDatabase.memory());
                addTearDown(db.close);
                final store = LocalSyncStore(db);
                await store.account();
                await store.setEnabled(enabled: true, boundUserId: 'user-1');
                await db.delete(db.syncOutbox).go();
                final auth = _FakeAuthRepository(
                  const AuthSession(userId: 'user-1'),
                );
                addTearDown(auth.controller.close);
                final gateway = _StatefulGateway();
                final coordinator = SyncCoordinator(
                  auth,
                  store,
                  gateway,
                  realtime: gateway,
                );
                addTearDown(coordinator.dispose);
                await _eventually(() async => gateway.onRealtimeDelete != null);

                final spec = syncSpecByEntity['user_setting']!;
                final seeded = await gateway.write(
                  record: SyncRecord(
                    spec: spec,
                    recordKey: 'theme',
                    values: {
                      'key': 'theme',
                      'value': 'dark',
                      'updated_at': DateTime.now().toUtc().toIso8601String(),
                    },
                    clientModifiedAt: DateTime.now().toUtc(),
                    originDeviceId: 'peer-device',
                  ),
                  userId: 'user-1',
                  deviceId: 'peer-device',
                  expectedRevision: null,
                );
                await store.applyRemoteFeedRecord(seeded.canonical!);
                await db.delete(db.syncOutbox).go();

                gateway.fetchRecordByKeyGate = Completer<void>();
                gateway.hardDelete(
                  userId: 'user-1',
                  spec: spec,
                  recordKey: 'theme',
                );
                await _eventually(() async => gateway.fetchRecordByKeyCalls > 0);

                auth.emit(
                  AuthEventType.signedIn,
                  const AuthSession(userId: 'user-2'),
                );
                gateway.fetchRecordByKeyGate!.complete();
                await Future<void>.delayed(const Duration(milliseconds: 100));

                final local = await db
                    .customSelect("SELECT value FROM settings WHERE key = 'theme'")
                    .getSingleOrNull();
                expect(local?.read<String>('value'), 'dark');
              },
            );

            test('duplicate realtime deletes reconcile idempotently', () async {
              final db = AppDatabase(executor: NativeDatabase.memory());
              addTearDown(db.close);
              final store = LocalSyncStore(db);
              await store.account();
              await store.setEnabled(enabled: true, boundUserId: 'user-1');
              await db.delete(db.syncOutbox).go();
              final auth = _FakeAuthRepository(
                const AuthSession(userId: 'user-1'),
              );
              addTearDown(auth.controller.close);
              final gateway = _StatefulGateway();
              final coordinator = SyncCoordinator(
                auth,
                store,
                gateway,
                realtime: gateway,
              );
              addTearDown(coordinator.dispose);
              await _eventually(() async => gateway.onRealtimeDelete != null);

              final spec = syncSpecByEntity['user_setting']!;
              final seeded = await gateway.write(
                record: SyncRecord(
                  spec: spec,
                  recordKey: 'theme',
                  values: {
                    'key': 'theme',
                    'value': 'dark',
                    'updated_at': DateTime.now().toUtc().toIso8601String(),
                  },
                  clientModifiedAt: DateTime.now().toUtc(),
                  originDeviceId: 'peer-device',
                ),
                userId: 'user-1',
                deviceId: 'peer-device',
                expectedRevision: null,
              );
              await store.applyRemoteFeedRecord(seeded.canonical!);
              await db.delete(db.syncOutbox).go();

              gateway.hardDelete(
                userId: 'user-1',
                spec: spec,
                recordKey: 'theme',
              );
              gateway.hardDelete(
                userId: 'user-1',
                spec: spec,
                recordKey: 'theme',
              );

              await _eventually(() async {
                return await db
                        .customSelect("SELECT 1 FROM settings WHERE key = 'theme'")
                        .getSingleOrNull() ==
                    null;
              });
              expect(gateway.fetchRecordByKeyCalls, greaterThanOrEqualTo(2));
            });
          '''
          if final_anchor not in tests:
              raise SystemExit('BUG-004 final test anchor not found')
          tests = tests.replace(final_anchor, '  );' + new_tests + '\n}\n\nFuture<void> _seedMaintenancePlanForSync(', 1)
          test_path.write_text(tests, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 .tmp_bug004_patch.py
          python .tmp_bug004_patch.py
          Remove-Item .tmp_bug004_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies and generated sources
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build

      - name: Format and run focused validation
        shell: pwsh
        run: |
          dart format lib/src/core/sync/sync_coordinator.dart lib/src/core/sync/local_sync_store.dart test/sync_coordinator_test.dart
          flutter analyze --no-pub
          flutter test --no-pub test/sync_coordinator_test.dart --concurrency=1 --timeout 3m --reporter expanded

      - name: Commit validated remediation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/core/sync/sync_coordinator.dart lib/src/core/sync/local_sync_store.dart test/sync_coordinator_test.dart
          git diff --cached --check
          git commit -m "Fix BUG-004 realtime delete reconciliation"
          git push origin HEAD:fix/bug-004-realtime-delete-reconciliation
