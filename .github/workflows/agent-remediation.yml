name: Agent remediation patch

on:
  push:
    branches:
      - agent/fix-data-contract-and-arabic-localization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Tighten one-time patcher guards
        run: python tool/fix_agent_patcher.py

      - name: Apply scoped remediation
        run: python tool/agent_remediation.py

      - name: Remove temporary automation
        run: |
          rm tool/agent_remediation.py
          rm tool/fix_agent_patcher.py
          rm .github/workflows/agent-remediation.yml

      - name: Check patch hygiene
        run: |
          git diff --check
          git status --short

      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix data contract and Arabic localization"
          git push origin HEAD:${GITHUB_REF_NAME}
