name: TEMP splash Dart format evidence

on:
  pull_request:
    branches:
      - apk-size-p2-splash-dedup

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format focused test
        shell: bash
        run: dart format test/android_splash_resource_test.dart

      - name: Upload exact formatted file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-splash-test
          path: test/android_splash_resource_test.dart
          if-no-files-found: error
          retention-days: 1
