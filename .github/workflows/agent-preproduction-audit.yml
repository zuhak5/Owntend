name: Agent preproduction audit formatting

on:
  push:
    branches:
      - fix/preproduction-state-integrity-audit

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Format source and tests
        shell: pwsh
        run: |
          dart format lib test
          $changes = git status --porcelain -- lib test
          if ([string]::IsNullOrWhiteSpace(($changes | Out-String))) {
            Write-Host "No formatting changes needed."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format action-clock duplicate guard"
          git push
