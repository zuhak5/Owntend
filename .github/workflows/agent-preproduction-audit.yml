name: Agent preproduction audit validation

on:
  push:
    branches:
      - fix/preproduction-state-integrity-audit

permissions:
  contents: read

jobs:
  flutter-canonical:
    name: Canonical Flutter validation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install workflow contract dependencies
        run: npm ci
      - name: Validate immutable GitHub Actions and release workflow contracts
        run: npm run test:release-workflows
      - name: Validate dependency security and license policy
        run: npm run test:dependency-security
      - name: Validate canonical toolchain contracts and manifest
        run: |
          npm run test:toolchain
          npm run validate:toolchain
      - name: Validate Android release lint gate
        run: npm run test:android-lint
      - name: Validate asset provenance and license policy
        run: |
          npm run test:asset-provenance
          npm run validate:asset-provenance
      - name: Validate canonical test and asset inventory
        run: npm run validate:test-inventory
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify pubspec.lock is unchanged
        shell: pwsh
        run: |
          $LockChanges = (git status --porcelain pubspec.lock 2>&1 | Out-String).Trim()
          if (-not [string]::IsNullOrWhiteSpace($LockChanges)) {
            Write-Error "pubspec.lock was modified unexpectedly."
            Write-Error $LockChanges
            exit 1
          }
      - name: Generate localization files
        run: flutter gen-l10n
      - name: Generate source files
        run: dart run build_runner build
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Parse production PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($Script in @(
            "tool/build_prod.ps1",
            "tool/build_play_prod.ps1",
            "tool/collect_android_release_evidence.ps1",
            "tool/publish_sentry_release.ps1"
          )) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $Script),
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parsing failed for $Script."
            }
          }
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run full Flutter tests
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config
      - name: Validate production configuration schema
        run: flutter test --no-pub test/prod_build_config_test.dart --dart-define-from-file=config/prod.example.json --dart-define=VERIFY_PRODUCTION_CONFIG=true

  timezone-baghdad:
    name: Recurrence timezone - Baghdad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Baghdad
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Run recurrence and date boundary tests
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/recurring_completion_precision_test.dart test/core_services_test.dart

  timezone-new-york:
    name: Recurrence timezone - New York
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Run recurrence and DST boundary tests
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/recurring_completion_precision_test.dart test/core_services_test.dart

  deno-security:
    name: Deno SSV tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.3"
      - name: Verify Deno formatting
        run: deno fmt --check supabase/functions/admob-ssv-handler/index.ts supabase/functions/admob-ssv-handler/index_test.ts supabase/functions/delete-account/index.ts supabase/functions/delete-account/index_test.ts supabase/functions/account-deletion-status/index.ts supabase/functions/account-deletion-status/index_test.ts
      - name: Type-check locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno install --frozen && cd ../../..
          cd supabase/functions/delete-account && deno install --frozen && cd ../../..
          cd supabase/functions/account-deletion-status && deno install --frozen && cd ../../..
          cd supabase/functions/admob-ssv-handler && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/delete-account && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno check --frozen index.ts && cd ../../..
      - name: Test locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..

  web-and-static-contracts:
    name: Google contract/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate test inventory and execute all canonical Node tests
        run: |
          npm run validate:test-inventory
          npm run validate:asset-provenance
          npm run test:all
      - name: Validate Google and Android contracts
        run: node tool/validate_google_release_contracts.mjs

  database-security:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Lint database schema
        run: npm run supabase:lint
      - name: Run database authorization and monetization tests
        run: npm run supabase:test
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
