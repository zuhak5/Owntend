name: Agent preproduction audit validation

on:
  push:
    branches:
      - fix/preproduction-state-integrity-audit

permissions:
  contents: read

jobs:
  home-structure:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Test home structure repository
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/home_structure_repository_test.dart

  recurring-completion:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Test recurring completion precision
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/recurring_completion_precision_test.dart

  sync-coordinator:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Test sync coordinator
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/sync_coordinator_test.dart

  trash-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Test trash lifecycle and invariants
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/trash_lifecycle_and_invariants_test.dart

  widget-regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Test widget regressions
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config test/widget_test.dart
