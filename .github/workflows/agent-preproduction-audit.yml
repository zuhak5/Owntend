name: Agent preproduction audit patch

on:
  push:
    branches:
      - fix/preproduction-state-integrity-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply verified phase-one fixes
        shell: bash
        run: |
          python .github/agent-preproduction-patch-v2.py
          git diff --check
          if git diff --quiet; then
            echo "No phase-one changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: anchor recurring completions to actual time"
          git push
