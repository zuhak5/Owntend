name: Agent preproduction audit validation

on:
  push:
    branches:
      - fix/preproduction-state-integrity-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localization files
        run: flutter gen-l10n
      - name: Generate source files
        run: dart run build_runner build
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test home structure repository
        id: test_home_structure
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/home_structure_repository_test.dart
      - name: Test recurring completion precision
        id: test_recurring_completion
        if: always()
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/recurring_completion_precision_test.dart
      - name: Test sync coordinator
        id: test_sync_coordinator
        if: always()
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/sync_coordinator_test.dart
      - name: Test trash lifecycle and invariants
        id: test_trash_lifecycle
        if: always()
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/trash_lifecycle_and_invariants_test.dart
      - name: Test widget regressions
        id: test_widget
        if: always()
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/widget_test.dart
      - name: Run complete Flutter suite
        id: test_full_suite
        if: always()
        shell: pwsh
        run: flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded --exclude-tags production-config
