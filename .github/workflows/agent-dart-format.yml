name: Agent Dart formatting

on:
  push:
    branches:
      - agent/fix-data-contract-and-arabic-localization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Remove temporary automation
        run: rm .github/workflows/agent-dart-format.yml

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "Format remediation sources"
          git push origin HEAD:${GITHUB_REF_NAME}
