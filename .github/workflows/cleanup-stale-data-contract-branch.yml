name: Cleanup stale data-contract branch

on:
  push:
    branches:
      - agent/fix-data-contract-and-arabic-localization

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Allow cleanup PR lifecycle to attach
        run: sleep 30
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/fix-data-contract-and-arabic-localization"
