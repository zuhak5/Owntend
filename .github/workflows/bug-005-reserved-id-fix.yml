name: Temporary BUG-005 reserved-ID fix

on:
  push:
    branches:
      - fix/bug-005-hash-qualified-charged-recovery

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/bug-005-hash-qualified-charged-recovery
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Patch reserved-ID semantics and regression coverage
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          controller_path = Path('lib/src/features/maintenance/application/task_creation_controller.dart')
          text = controller_path.read_text(encoding='utf-8')

          gate_start_marker = "      if (existingOperation == null && monetizationRepo != null) {"
          gate_end_marker = "      final operationId = existingOperation?.operationId ?? _uuid.v7();"
          gate_start = text.index(gate_start_marker)
          gate_end = text.index(gate_end_marker, gate_start) + len(gate_end_marker)
          gate_replacement = """      final hasRetainedPayload =
              existingOperation?.requestPayload.isNotEmpty ?? false;
          final hasRetainedHash =
              existingOperation?.requestHash.trim().isNotEmpty ?? false;
          if (existingOperation != null &&
              (existingOperation.accountScope != accountScope ||
                  hasRetainedPayload != hasRetainedHash)) {
            throw const TaskCreationFailure(
              'The retained charged operation cannot be replayed safely.',
              code: TaskCreationFailureCode.operationIdReused,
            );
          }
          final isRetainedReplay = hasRetainedPayload && hasRetainedHash;

          if (!isRetainedReplay && monetizationRepo != null) {
            await _recoverBeforeNewChargedOperation(
              operationStore: operationStore,
              accountScope: accountScope,
            );
          }

          final operationId = existingOperation?.operationId ?? _uuid.v7();"""
          text = text[:gate_start] + gate_replacement + text[gate_end:]

          request_start_marker = "      final Map<String, dynamic> requestPayload;"
          operation_marker = "      final operation = TaskCreationOperation("
          request_start = text.index(request_start_marker)
          request_end = text.index(operation_marker, request_start)
          request_replacement = """      final Map<String, dynamic> requestPayload;
          final String requestHash;
          if (isRetainedReplay) {
            if (existingOperation!.requestPayload['request_hash'] !=
                existingOperation.requestHash) {
              throw const TaskCreationFailure(
                'The retained charged operation cannot be replayed safely.',
                code: TaskCreationFailureCode.operationIdReused,
              );
            }
            requestHash = existingOperation.requestHash;
            requestPayload = Map<String, dynamic>.from(
              existingOperation.requestPayload,
            );
          } else {
            requestHash = computedRequestHash;
            requestPayload = {
              ...unsignedRequestPayload,
              'request_hash': requestHash,
            };
          }

"""
          text = text[:request_start] + request_replacement + text[request_end:]
          controller_path.write_text(text, encoding='utf-8')

          test_path = Path('test/bug_005_charged_operation_recovery_test.dart')
          test = test_path.read_text(encoding='utf-8')
          call_pattern = re.compile(
              r"(final created = await controller\.createNewTask\(.*?accountScope: 'account-1',\n)(\s*\);)",
              re.S,
          )
          matches = list(call_pattern.finditer(test))
          if len(matches) != 2:
              raise SystemExit(f'expected 2 createNewTask calls, found {len(matches)}')

          placeholders = [
              """      existingOperation: TaskCreationOperation(
                operationId: 'op-reserved-next',
                planId: 'plan-reserved-next',
                accountScope: 'account-1',
                requestPayload: const {},
                requestHash: '',
                state: TaskCreationOperationState.submitting,
                createdAt: now,
                updatedAt: now,
              ),
""",
              """        existingOperation: TaskCreationOperation(
          operationId: 'op-reserved-new',
          planId: 'plan-reserved-new',
          accountScope: 'account-1',
          requestPayload: const {},
          requestHash: '',
          state: TaskCreationOperationState.submitting,
          createdAt: DateTime.utc(2026, 8, 17),
          updatedAt: DateTime.utc(2026, 8, 17),
        ),
""",
          ]
          for index in (1, 0):
              match = matches[index]
              replacement = match.group(1) + placeholders[index] + match.group(2)
              test = test[:match.start()] + replacement + test[match.end():]
          test_path.write_text(test, encoding='utf-8')
          '@ | python -
      - name: Format
        run: dart format lib/src/features/maintenance/application/task_creation_controller.dart test/bug_005_charged_operation_recovery_test.dart
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Focused regression tests
        run: >-
          flutter test --no-pub --concurrency=1
          test/bug_005_charged_operation_recovery_test.dart
          test/widget_test.dart --plain-name "task editor can create and add another task"
      - name: Remove harness and commit
        shell: pwsh
        run: |
          git rm .github/workflows/bug-005-reserved-id-fix.yml
          git add lib/src/features/maintenance/application/task_creation_controller.dart
          git add test/bug_005_charged_operation_recovery_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix BUG-005 reserved operation ID semantics"
          git push origin HEAD:fix/bug-005-hash-qualified-charged-recovery
