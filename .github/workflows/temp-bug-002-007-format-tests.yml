name: Temporary BUG-002 BUG-007 test formatter

on:
  push:
    branches:
      - fix/bug-002-bug-007-account-safety

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-002-bug-007-account-safety
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      - name: Apply pinned Dart formatter
        shell: bash
        run: |
          dart format \
            test/account_cleanup_startup_recovery_test.dart \
            test/account_safety_auth_repository_test.dart \
            test/local_account_data_cleaner_test.dart \
            test/signout_barrier_test.dart
          rm .github/workflows/temp-bug-002-007-format-tests.yml

      - name: Commit formatter output and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            test/account_cleanup_startup_recovery_test.dart \
            test/account_safety_auth_repository_test.dart \
            test/local_account_data_cleaner_test.dart \
            test/signout_barrier_test.dart \
            .github/workflows/temp-bug-002-007-format-tests.yml
          git diff --cached --check
          git commit -m "Format account safety regression tests"
          git push origin HEAD:fix/bug-002-bug-007-account-safety
