name: Problem 4 branch helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transform-generate-check:
    if: github.event.pull_request.head.ref == 'agent/problem-4-remove-category'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/problem-4-remove-category
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install branch-helper diagnostics
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply scoped Problem 4 transforms
        run: python tool/problem4_apply.py

      - name: Generate repository-owned sources
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart format lib test integration_test

      - name: Analyze transformed implementation
        run: flutter analyze --no-pub

      - name: Run focused Problem 4 tests
        run: >-
          flutter test --no-pub --concurrency=1 --timeout 3m
          test/database_migration_test.dart
          test/search_localization_test.dart
          test/bug_015_search_generation_test.dart
          test/free_asset_creation_test.dart
          test/sync_store_test.dart
          test/backup_service_test.dart

      - name: Commit generated implementation and remove helper artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/problem4-branch-helper.yml tool/problem4_apply.py tool/sitecustomize.py .problem4-focused-validation
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Problem #4: remove Category item classification"
            git push origin HEAD:agent/problem-4-remove-category
          fi
