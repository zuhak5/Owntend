name: Problem 4 fixture cleanup

on:
  push:
    branches:
      - agent/problem-4-remove-category

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/problem-4-remove-category
          fetch-depth: 0

      - name: Remove stale Category fixture values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/0012_points_monetization.test.sql')
          text = path.read_text(encoding='utf-8')
          for asset_type, old_category in (
              ('general', 'category_general'),
              ('device', 'category_appliances'),
              ('safety', 'category_safety'),
          ):
              text = text.replace(
                  f"'asset_type', '{asset_type}', '{old_category}',",
                  f"'asset_type', '{asset_type}',",
              )
          path.write_text(text, encoding='utf-8')
          if 'category_' in text:
              raise SystemExit('stale Category fixture token remains')
          PY

      - name: Commit fixture repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/problem4-fixture-cleanup.yml
          git add supabase/tests/database/0012_points_monetization.test.sql
          git diff --cached --check
          git commit -m "Fix Problem #4 monetization fixture payloads"
          git push origin HEAD:agent/problem-4-remove-category
