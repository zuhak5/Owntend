name: Apply BUG-003 branch patch

on:
  push:
    branches:
      - fix/bug-003-durable-restore-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply BUG-003 implementation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/bug-003-durable-restore-recovery
      - name: Apply scoped remediation edits
        run: python tool/bug003_apply.py
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Remove temporary branch-only patch harness
        run: git rm .github/workflows/bug003-apply.yml tool/bug003_apply.patch tool/bug003_apply.py
      - name: Commit remediation implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test docs
          git commit -m "Fix BUG-003 durable restore recovery"
          git push origin HEAD:fix/bug-003-durable-restore-recovery
