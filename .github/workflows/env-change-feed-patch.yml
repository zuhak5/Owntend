name: Apply ENV coordinator integration patch

on:
  push:
    branches:
      - fix/env-001-003-change-feed-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Apply coordinator patch
        run: python3 tool/env_change_feed_patch.py

      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate hardened change-feed pull contract"
          git push origin HEAD:fix/env-001-003-change-feed-contract
