          Path('lib/src/core/sync/change_feed_contract.dart').write_text(r'''import '../supabase/supabase_failure.dart';
import 'sync_dtos.dart';

const syncFeedContractVersion = '2.0.0';
const _syncFeedOperations = {'INSERT', 'UPDATE', 'DELETE'};

class ParsedSyncFeedChange {
  const ParsedSyncFeedChange({
    required this.spec,
    required this.recordKey,
    required this.operation,
    required this.keyValues,
  });

  final SyncEntitySpec spec;
  final String recordKey;
  final String operation;
  final Map<String, dynamic> keyValues;
}

void requireSyncFeedContractVersion(String version) {
  if (version != syncFeedContractVersion) {
    throw syncFeedProtocolFailure();
  }
}

SyncEntitySpec syncFeedSpecForEntity(String entity) {
  final spec = syncSpecByEntity[entity];
  if (spec == null) {
    throw syncFeedProtocolFailure();
  }
  return spec;
}

ParsedSyncFeedChange parseSyncFeedChange(Map<String, dynamic> change) {
  final entity = change['entity_type'];
  final operation = change['op_type'];
  final rawKeyData = change['key_data'];
  final rawRecordId = change['record_id'];
  if (entity is! String ||
      operation is! String ||
      !_syncFeedOperations.contains(operation) ||
      rawKeyData is! Map ||
      rawRecordId is! String) {
    throw syncFeedProtocolFailure();
  }

  final spec = syncFeedSpecForEntity(entity);
  late final Map<String, dynamic> keyData;
  try {
    keyData = Map<String, dynamic>.from(rawKeyData);
  } on Object {
    throw syncFeedProtocolFailure();
  }
  final expectedKeys = spec.keyColumns.toSet();
  final actualKeys = keyData.keys.toSet();
  if (actualKeys.length != expectedKeys.length ||
      !actualKeys.containsAll(expectedKeys)) {
    throw syncFeedProtocolFailure();
  }

  final keyValues = <String, dynamic>{};
  for (final column in spec.keyColumns) {
    final value = keyData[column];
    if (value is! String || value.isEmpty) {
      throw syncFeedProtocolFailure();
    }
    keyValues[column] = value;
  }
  final recordKey = spec.keyColumns.isEmpty
      ? spec.entity
      : spec.keyColumns.map((column) => keyValues[column]).join('|');
  if (rawRecordId != recordKey) {
    throw syncFeedProtocolFailure();
  }

  return ParsedSyncFeedChange(
    spec: spec,
    recordKey: recordKey,
    operation: operation,
    keyValues: Map.unmodifiable(keyValues),
  );
}

SupabaseFailure syncFeedProtocolFailure() {
  return const SupabaseFailure(
    kind: SupabaseFailureKind.incompatibleSchema,
    message:
        'This Owntend build is not compatible with the cloud sync protocol. '
        'Install the latest release.',
  );
}
''')

          Path('lib/src/core/sync/local_sync_store_change_feed.dart').write_text(r'''import 'local_sync_store.dart';

const _feedCursorEntity = 'server_change_feed';
const _feedResnapshotEntity = 'server_change_feed_resnapshot';

extension LocalSyncStoreChangeFeed on LocalSyncStore {
  Future<int?> feedResnapshotHighWater() async {
    final row = await db
        .customSelect(
          'SELECT last_sync_seq FROM sync_cursors WHERE entity = ? LIMIT 1',
          variables: [],
        )
        .getSingleOrNull();
    if (row == null) {
      final fallback = await db
          .customSelect(
            "SELECT last_sync_seq FROM sync_cursors "
            "WHERE entity = '$_feedResnapshotEntity' LIMIT 1",
          )
          .getSingleOrNull();
      return fallback?.read<int>('last_sync_seq');
    }
    return row.read<int>('last_sync_seq');
  }

  Future<void> resetFeedCursorForResnapshot({
    required int highWaterSeq,
  }) async {
    if (highWaterSeq < 0) {
      throw ArgumentError.value(highWaterSeq, 'highWaterSeq');
    }
    await db.transaction(() async {
      final existing = await feedResnapshotHighWater();
      if (existing != null && existing != highWaterSeq) {
        throw StateError('A different feed resnapshot is already pending.');
      }
      await db.customStatement('''
INSERT INTO sync_cursors(entity, last_sync_seq, last_record_key)
VALUES ('$_feedCursorEntity', 0, NULL)
ON CONFLICT(entity) DO UPDATE SET
  last_sync_seq = 0,
  last_record_key = NULL
''');
      await db.customStatement(
        '''
INSERT INTO sync_cursors(entity, last_sync_seq, last_record_key)
VALUES ('$_feedResnapshotEntity', ?, NULL)
ON CONFLICT(entity) DO UPDATE SET
  last_sync_seq = excluded.last_sync_seq,
  last_record_key = NULL
''',
        [highWaterSeq],
      );
    });
  }

  Future<void> completeFeedResnapshot(int highWaterSeq) async {
    await db.transaction(() async {
      final pending = await feedResnapshotHighWater();
      if (pending != highWaterSeq) {
        throw StateError('Feed resnapshot completion does not match its marker.');
      }
      await db.customStatement(
        '''
INSERT INTO sync_cursors(entity, last_sync_seq, last_record_key)
VALUES ('$_feedCursorEntity', ?, NULL)
ON CONFLICT(entity) DO UPDATE SET
  last_sync_seq = excluded.last_sync_seq,
  last_record_key = NULL
''',
        [highWaterSeq],
      );
      await db.customStatement(
        "DELETE FROM sync_cursors WHERE entity = '$_feedResnapshotEntity'",
      );
    });
  }
}
''')

          Path('test/env_001_003_change_feed_contract_test.dart').write_text(r'''import 'package:drift/native.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:owntend/src/core/database/app_database.dart';
import 'package:owntend/src/core/supabase/supabase_failure.dart';
import 'package:owntend/src/core/sync/change_feed_contract.dart';
import 'package:owntend/src/core/sync/local_sync_store.dart';
import 'package:owntend/src/core/sync/local_sync_store_change_feed.dart';
import 'package:owntend/src/core/sync/sync_dtos.dart';

void main() {
  group('ENV-001/002 change-feed wire contract', () {
    test('every client sync entity has one strict feed identifier and key set', () {
      final specs = [...syncEntitySpecs, profileSyncSpec];
      expect(specs.map((spec) => spec.entity).toSet().length, specs.length);

      for (final spec in specs) {
        final keyData = <String, dynamic>{
          for (final column in spec.keyColumns) column: 'value-$column',
        };
        final recordKey = spec.keyColumns.isEmpty
            ? spec.entity
            : spec.keyColumns.map((column) => keyData[column]).join('|');
        final parsed = parseSyncFeedChange({
          'entity_type': spec.entity,
          'record_id': recordKey,
          'op_type': 'DELETE',
          'key_data': keyData,
        });

        expect(parsed.spec, same(spec));
        expect(parsed.recordKey, recordKey);
        expect(parsed.keyValues, keyData);
      }
    });

    test('composite key JSON order does not change canonical record key', () {
      final parsed = parseSyncFeedChange({
        'entity_type': 'asset_tag',
        'record_id': 'asset-1|tag-1',
        'op_type': 'DELETE',
        'key_data': {'tag_id': 'tag-1', 'asset_id': 'asset-1'},
      });

      expect(parsed.recordKey, 'asset-1|tag-1');
      expect(parsed.keyValues, {'asset_id': 'asset-1', 'tag_id': 'tag-1'});
    });

    test('unknown entity fails closed', () {
      expect(
        () => parseSyncFeedChange({
          'entity_type': 'future_entity',
          'record_id': 'future-1',
          'op_type': 'UPDATE',
          'key_data': {'id': 'future-1'},
        }),
        _isProtocolFailure,
      );
    });

    test('missing, extra, empty, or mismatched keys fail closed', () {
      for (final change in <Map<String, dynamic>>[
        {
          'entity_type': 'asset_tag',
          'record_id': 'asset-1|tag-1',
          'op_type': 'DELETE',
          'key_data': {'asset_id': 'asset-1'},
        },
        {
          'entity_type': 'asset_tag',
          'record_id': 'asset-1|tag-1',
          'op_type': 'DELETE',
          'key_data': {
            'asset_id': 'asset-1',
            'tag_id': 'tag-1',
            'other': 'nope',
          },
        },
        {
          'entity_type': 'area',
          'record_id': 'area-1',
          'op_type': 'DELETE',
          'key_data': {'id': ''},
        },
        {
          'entity_type': 'asset_tag',
          'record_id': 'wrong-order',
          'op_type': 'DELETE',
          'key_data': {'asset_id': 'asset-1', 'tag_id': 'tag-1'},
        },
      ]) {
        expect(() => parseSyncFeedChange(change), _isProtocolFailure);
      }
    });

    test('unsupported capability version fails closed', () {
      expect(() => requireSyncFeedContractVersion('1.0.0'), _isProtocolFailure);
      expect(
        () => requireSyncFeedContractVersion(syncFeedContractVersion),
        returnsNormally,
      );
    });
  });

  group('ENV-003 retention-gap cursor recovery', () {
    late AppDatabase db;
    late LocalSyncStore store;

    setUp(() {
      db = AppDatabase(executor: NativeDatabase.memory());
      store = LocalSyncStore(db);
    });

    tearDown(() => db.close());

    test('ordinary cursor remains monotonic', () async {
      await store.setFeedCursor(100);
      await store.setFeedCursor(50);
      expect(await store.getFeedCursor(), 100);
    });

    test('resnapshot reset can move 100 to zero and persists restart marker', () async {
      await store.setFeedCursor(100);
      await store.resetFeedCursorForResnapshot(highWaterSeq: 240);

      expect(await store.getFeedCursor(), 0);
      expect(await store.feedResnapshotHighWater(), 240);

      final restarted = LocalSyncStore(db);
      expect(await restarted.getFeedCursor(), 0);
      expect(await restarted.feedResnapshotHighWater(), 240);
    });

    test('successful resnapshot advances to captured high-water and clears marker', () async {
      await store.setFeedCursor(100);
      await store.resetFeedCursorForResnapshot(highWaterSeq: 240);
      await store.completeFeedResnapshot(240);

      expect(await store.getFeedCursor(), 240);
      expect(await store.feedResnapshotHighWater(), isNull);
      await store.setFeedCursor(200);
      expect(await store.getFeedCursor(), 240);
    });
  });
}

final _isProtocolFailure = throwsA(
  isA<SupabaseFailure>().having(
    (failure) => failure.kind,
    'kind',
    SupabaseFailureKind.incompatibleSchema,
  ),
);
''')

