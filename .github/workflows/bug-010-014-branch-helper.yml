name: BUG-010-014 Branch Helper

on:
  push:
    branches:
      - fix/bug-010-bug-014-notification-consumers

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate notification bootstrap and tests
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -R -n "class NotificationBootstrap\|NotificationBootstrap" lib test || true
            grep -R -n "notificationAutoStartProvider\|dailyRefreshTask\|reminderReconciliationRequests" lib test || true
            grep -R -n "FakeNotificationScheduler\|implements NotificationScheduler" test lib || true
          } | tee /tmp/inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bug-010-014-inspection
          path: /tmp/inspection.txt
          if-no-files-found: error
