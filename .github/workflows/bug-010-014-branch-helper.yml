name: BUG-010-014 Branch Helper

on:
  push:
    branches:
      - fix/bug-010-bug-014-notification-consumers

permissions:
  contents: write

concurrency:
  group: bug-010-014-branch-helper
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remediation
        run: |
          python3 tool/bug_010_014_branch_helper.py
          python3 tool/bug_010_014_branch_fixups.py
          python3 tool/bug_010_014_test_fixups.py
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format remediation
        run: dart format lib/src/core/services/reminder_schedule_reconciler.dart lib/src/core/services/notification_service.dart lib/src/core/providers/app_providers.dart lib/src/features/startup/presentation/startup_restoration_screen.dart lib/src/features/startup/presentation/startup_bootstrap.dart test/bug_010_bug_014_notification_consumers_test.dart
      - name: Generate localization and sources
        run: |
          flutter gen-l10n
          dart run build_runner build
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze-output.log
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-010-014-analyze
          path: analyze-output.log
          if-no-files-found: ignore
      - name: Run focused remediation tests
        shell: bash
        run: |
          set -o pipefail
          {
            flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/bug_010_bug_014_notification_consumers_test.dart
            flutter test --no-pub --concurrency=1 --timeout 3m --reporter expanded test/widget_test.dart --plain-name "notification bootstrap initializes without prompting"
          } 2>&1 | tee focused-test-output.log
      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-010-014-focused-tests
          path: focused-test-output.log
          if-no-files-found: ignore
      - name: Commit validated remediation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add CHANGELOG.md lib test/bug_010_bug_014_notification_consumers_test.dart
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix BUG-010 and BUG-014 notification consumers"
          git push origin HEAD:fix/bug-010-bug-014-notification-consumers
