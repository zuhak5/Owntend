name: TEMP Problem 7 main-push observer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: github.head_ref == 'fix/problem-7-points-counter-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Observe automatic main push checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: bb257907f6d32f347c6c4b3a7a1879f7ba7f3095
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/runs?event=push&branch=main&head_sha=${MERGE_SHA}&per_page=100"
          for attempt in $(seq 1 80); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"

            flutter="$(jq -r --arg sha "${MERGE_SHA}" '.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .name == "Validate Flutter") | [.id, .status, (.conclusion // "")] | @tsv' <<<"${payload}" | head -n 1)"
            backend="$(jq -r --arg sha "${MERGE_SHA}" '.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .name == "Validate Google Backend and Release Contracts") | [.id, .status, (.conclusion // "")] | @tsv' <<<"${payload}" | head -n 1)"

            echo "attempt=${attempt} flutter=${flutter:-missing} backend=${backend:-missing}"
            if [[ -n "${flutter}" && -n "${backend}" ]]; then
              flutter_id="$(cut -f1 <<<"${flutter}")"
              flutter_status="$(cut -f2 <<<"${flutter}")"
              flutter_conclusion="$(cut -f3 <<<"${flutter}")"
              backend_id="$(cut -f1 <<<"${backend}")"
              backend_status="$(cut -f2 <<<"${backend}")"
              backend_conclusion="$(cut -f3 <<<"${backend}")"

              if [[ "${flutter_status}" == "completed" && "${backend_status}" == "completed" ]]; then
                echo "Validate Flutter run ${flutter_id}: ${flutter_conclusion}"
                echo "Validate Google Backend and Release Contracts run ${backend_id}: ${backend_conclusion}"
                if [[ "${flutter_conclusion}" == "success" && "${backend_conclusion}" == "success" ]]; then
                  exit 0
                fi
                exit 1
              fi
            fi
            sleep 15
          done

          echo "Timed out observing automatic push-to-main checks for ${MERGE_SHA}." >&2
          exit 1
