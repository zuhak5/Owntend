name: Agent controlled localization centralization

on:
  push:
    branches:
      - agent/fix-data-contract-and-arabic-localization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Centralize controlled localization
        run: python tool/agent_domain_localization.py

      - name: Remove temporary automation
        run: |
          rm tool/agent_domain_localization.py
          rm .github/workflows/agent-domain-localization.yml

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit and push centralization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize controlled localization"
          git push origin HEAD:${GITHUB_REF_NAME}
