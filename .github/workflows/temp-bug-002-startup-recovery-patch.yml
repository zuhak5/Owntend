name: Temporary BUG-002 startup recovery patch

on:
  push:
    branches:
      - fix/bug-002-bug-007-account-safety

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-002-bug-007-account-safety
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      - name: Apply scoped startup recovery edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/startup/presentation/startup_bootstrap.dart')
          source = path.read_text()

          old_fields = """class _DeferredOwntendBootstrapState extends State<_DeferredOwntendBootstrap> {
            SupabaseClient? _supabaseClient;
            bool _ready = false;
          """
          new_fields = """class _DeferredOwntendBootstrapState extends State<_DeferredOwntendBootstrap> {
            SupabaseClient? _supabaseClient;
            Object? _accountCleanupRecoveryFailure;
            bool _accountCleanupRetrying = false;
            bool _ready = false;
          """
          if old_fields not in source:
            raise SystemExit('startup state fields anchor not found')
          source = source.replace(old_fields, new_fields, 1)

          initialize_start = source.index(
              '  Future<void> _initializeAfterFirstFrame() async {'
          )
          diagnostics_start = source.index(
              '    try {\n      final support = await getApplicationSupportDirectory();',
              initialize_start,
          )
          new_initialize = """  Future<bool> _resumePendingAccountCleanup() async {
            try {
              final resumed =
                  await LocalAccountDataCleaner(LocalSyncStore(widget.database))
                      .resumePendingCleanup(
                        additionalCleanup: (accountId) async {
                          await const OfflineCreationDraftStore().clearForAccount(
                            accountId,
                          );
                          await TaskCreationOperationStore(
                            storage: const FlutterSecureStorage(),
                          ).clearOperationsForAccount(accountId);
                        },
                      );
              if (resumed) AppLogger.info('account_deletion_local_cleanup_resumed');
              if (mounted && _accountCleanupRecoveryFailure != null) {
                setState(() => _accountCleanupRecoveryFailure = null);
              }
              return true;
            } on Object catch (error) {
              AppLogger.warning(
                'account_deletion_local_cleanup_resume_blocked',
                error: error,
              );
              if (mounted) {
                setState(() => _accountCleanupRecoveryFailure = error);
              }
              return false;
            }
          }

          Future<void> _retryPendingAccountCleanup() async {
            if (_accountCleanupRetrying) return;
            setState(() => _accountCleanupRetrying = true);
            try {
              await _initializeAfterFirstFrame();
            } finally {
              if (mounted) {
                setState(() => _accountCleanupRetrying = false);
              }
            }
          }

          Future<void> _initializeAfterFirstFrame() async {
            final deviceLanguage = _supportedDeviceLanguage(
              WidgetsBinding.instance.platformDispatcher.locale,
            );
            initializeRestoreForegroundService(localeCode: deviceLanguage.name);
            if (!await _resumePendingAccountCleanup()) return;
          """
          source = source[:initialize_start] + new_initialize + source[diagnostics_start:]

          build_start = source.index(
              '  @override\n  Widget build(BuildContext context) {',
              source.index('class _DeferredOwntendBootstrapState'),
          )
          ready_if = source.index('    if (!_ready) {', build_start)
          recovery_branch = """    if (_accountCleanupRecoveryFailure != null) {
              return OwntendStartupFailure(
                accountCleanupBlocked: true,
                onRetry: _accountCleanupRetrying
                    ? null
                    : _retryPendingAccountCleanup,
              );
            }
          """
          source = source[:ready_if] + recovery_branch + source[ready_if:]

          failure_start = source.index('class OwntendStartupFailure extends StatelessWidget {')
          override_start = source.index('\n\n  @override', failure_start)
          new_failure_header = """class OwntendStartupFailure extends StatelessWidget {
            const OwntendStartupFailure({
              this.cloudUnavailable = false,
              this.accountCleanupBlocked = false,
              this.onRetry,
              super.key,
            });

            final bool cloudUnavailable;
            final bool accountCleanupBlocked;
            final Future<void> Function()? onRetry;
          """
          source = source[:failure_start] + new_failure_header + source[override_start:]

          message_start = source.index(
              '                      Text(\n                        cloudUnavailable',
              failure_start,
          )
          message_end = source.index(
              '                      ),',
              message_start,
          ) + len('                      ),')
          new_message = """                      Text(
                        accountCleanupBlocked
                            ? context.l10n.accountDeletionFailed
                            : cloudUnavailable
                            ? context
                                  .l10n
                                  .cloudServicesAreUnavailablePleaseTryAgainLater
                            : context.l10n.thisBuildIsNotConfiguredCorrectly,
                        textAlign: TextAlign.center,
                      ),
                      if (accountCleanupBlocked) ...[
                        const SizedBox(height: 16),
                        FilledButton(
                          onPressed: onRetry == null
                              ? null
                              : () => unawaited(onRetry!()),
                          child: Text(context.l10n.retry),
                        ),
                      ]"""
          source = source[:message_start] + new_message + source[message_end:]

          path.write_text(source)
          PY

          dart format lib/src/features/startup/presentation/startup_bootstrap.dart
          rm .github/workflows/temp-bug-002-startup-recovery-patch.yml

      - name: Commit scoped edit and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/features/startup/presentation/startup_bootstrap.dart .github/workflows/temp-bug-002-startup-recovery-patch.yml
          git diff --cached --check
          git commit -m "Block startup on unsafe account cleanup recovery"
          git push origin HEAD:fix/bug-002-bug-007-account-safety
