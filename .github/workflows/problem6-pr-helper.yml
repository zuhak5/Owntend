name: Problem 6 temporary PR helper

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-generate-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Apply scoped Problem 6 patch
        run: python tool/problem6_apply.py
      - name: Resolve and generate
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart format lib/main.dart lib/src/features/backup/presentation/backup_screen.dart lib/src/features/maintenance/presentation/daily_completion_reward_sheet.dart test/problem_006_completion_reward_sheet_test.dart
      - name: Run focused Flutter regressions
        run: |
          flutter test --no-pub test/problem_006_completion_reward_sheet_test.dart
          flutter test --no-pub test/bug_011_notification_completion_ack_test.dart
          flutter test --no-pub test/monetization_test.dart
      - name: Commit generated scoped change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/main.dart lib/src/features/backup/presentation/backup_screen.dart lib/src/features/maintenance/presentation/daily_completion_reward_sheet.dart lib/l10n/app_en.arb lib/l10n/app_ar.arb lib/l10n/app_localizations.dart lib/l10n/app_localizations_en.dart lib/l10n/app_localizations_ar.dart test/problem_006_completion_reward_sheet_test.dart docs/architecture/monetization.md CHANGELOG.md
          git commit -m "fix: compact daily completion reward sheet"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
