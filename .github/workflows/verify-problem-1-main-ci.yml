name: Verify Problem 1 merged main CI

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Report exact merged-main push runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query exact merged-main push runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e5c27c377d508eec4e09ed5488dd0e9b577e6560
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")"
          echo "$response" | jq -r '
            .workflow_runs[]
            | select(.name == "Validate Flutter" or .name == "Validate Google Backend and Release Contracts")
            | "RUN id=\(.id) name=\(.name) event=\(.event) head_sha=\(.head_sha) status=\(.status) conclusion=\(.conclusion) run_number=\(.run_number) url=\(.html_url)"
          '
