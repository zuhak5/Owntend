name: Temporary Problem 8 Formatter Helper

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  format-problem-8:
    if: >-
      github.event.pull_request.head.ref == 'fix/problem-8-live-runtime-updates' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/problem-8-live-runtime-updates
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Format Problem 8 files and remove helper
        shell: pwsh
        run: |
          dart format lib/src/core/sync/sync_coordinator.dart test/problem_008_live_runtime_updates_test.dart
          git rm .github/workflows/temp-problem-8-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/core/sync/sync_coordinator.dart test/problem_008_live_runtime_updates_test.dart
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
            git commit -m "Format Problem 8 runtime update files"
            git push origin HEAD:fix/problem-8-live-runtime-updates
          }
