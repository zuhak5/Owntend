name: Agent search schema hardening

on:
  push:
    branches:
      - agent/fix-data-contract-and-arabic-localization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply search schema hardening
        run: python tool/agent_search_schema.py

      - name: Remove temporary automation
        run: |
          rm tool/agent_search_schema.py
          rm .github/workflows/agent-search-schema.yml

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit and push search hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden bilingual search snippets"
          git push origin HEAD:${GITHUB_REF_NAME}
