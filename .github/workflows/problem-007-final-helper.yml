name: Problem 007 final branch helper

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.ref == 'fix/problem-7-points-counter-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified Problem 7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tool/.problem007_small_* | base64 -d > /tmp/problem_007_apply.py.gz
          echo 'ef35bd0f65f21875d69e13bf552c8a32109e41f1d5be0b28e17ea81facd3a435  /tmp/problem_007_apply.py.gz' | sha256sum -c -
          gzip -d -c /tmp/problem_007_apply.py.gz > tool/problem_007_apply.py
          echo '97cf57a95f62716068f16b230a20b06c9bc0b89073a2ff7009e23d5fed3f1e1e  tool/problem_007_apply.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p = Path('tool/problem_007_apply.py')
          t = p.read_text()
          a = '    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one anchor, found {count}: {old[:120]!r}")\n'
          b = ('    if count == 0 and path in {\n'
               '        "lib/src/features/maintenance/application/task_creation_controller.dart",\n'
               '        "lib/src/features/monetization/charged_operation_resolver.dart",\n'
               '    }:\n'
               '        return\n' + a)
          if t.count(a) != 1: raise SystemExit('replace guard mismatch')
          t = t.replace(a, b, 1)
          a = '    if count != 1:\n        raise RuntimeError(f"{path}: regex anchor failed: {pattern[:120]!r}")\n'
          b = ('    if count == 0 and path == "lib/src/features/monetization/charged_operation_resolver.dart":\n'
               '        return\n' + a)
          if t.count(a) != 1: raise SystemExit('regex guard mismatch')
          t = t.replace(a, b, 1)
          start = t.index('text = read("lib/src/features/assets/presentation/asset_dialogs.dart")')
          end_marker = 'write("lib/src/features/assets/presentation/asset_dialogs.dart", text)'
          end = t.index(end_marker, start) + len(end_marker)
          p.write_text(t[:start] + '# asset dialogs patched by current-main finalize\n' + t[end:])
          PY
          python tool/problem_007_apply.py
          python tool/problem_007_finalize.py
          rm -f tool/.problem007_payload_* tool/.problem007_gz_* tool/.problem007_small_* tool/.problem007_trigger
          rm -f tool/problem_007_apply.py tool/problem_007_finalize.py
          rm -f .github/workflows/problem-007-helper.yml .github/workflows/problem-007-final-helper.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve and generate
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build

      - name: Format and analyze
        run: |
          dart format \
            lib/src/features/monetization/monetization.dart \
            lib/src/features/monetization/charged_operation_resolver.dart \
            lib/src/features/maintenance/application/task_creation_controller.dart \
            lib/src/features/assets/presentation/asset_dialogs.dart \
            test/charged_operation_journal_test.dart \
            test/problem_007_wallet_sync_test.dart
          flutter analyze --no-pub

      - name: Run focused Problem 7 regressions
        run: >-
          flutter test --no-pub --concurrency=1
          test/problem_007_wallet_sync_test.dart
          test/charged_operation_journal_test.dart
          test/monetization_test.dart
          test/task_creation_insufficient_points_test.dart
          test/bug_005_startup_recovery_wiring_test.dart
          test/bug_011_notification_completion_ack_test.dart

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add -A
          git commit -m 'fix: synchronize authoritative point wallet state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
