name: Settings Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-settings-prep:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies and generated sources
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build

      - name: Format touched Dart files
        shell: pwsh
        run: >-
          dart format
          lib/src/features/settings/presentation/settings_screen.dart
          test/settings_layout_test.dart

      - name: Run focused Settings layout regression test
        shell: pwsh
        run: flutter test --no-pub test/settings_layout_test.dart

      - name: Refresh intended Settings goldens
        shell: pwsh
        run: >-
          flutter test
          --no-pub
          --update-goldens
          --plain-name "production surfaces have stable English and Arabic visual baselines"
          test/widget_test.dart

      - name: Upload prepared Settings outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: settings-prepared-outputs
          path: |
            lib/src/features/settings/presentation/settings_screen.dart
            test/settings_layout_test.dart
            test/goldens/production_settings_en.png
            test/goldens/production_settings_ar.png
          if-no-files-found: error
          retention-days: 1
