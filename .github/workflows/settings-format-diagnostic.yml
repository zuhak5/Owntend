name: Settings Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-settings-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format diagnostic copies
        shell: bash
        run: |
          mkdir -p /tmp/settings-format
          cp lib/src/features/settings/presentation/settings_screen.dart /tmp/settings-format/settings_screen.dart
          cp test/settings_layout_test.dart /tmp/settings-format/settings_layout_test.dart
          dart format /tmp/settings-format

      - name: Upload formatted diagnostic copies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: settings-formatted-source
          path: /tmp/settings-format
          if-no-files-found: error
          retention-days: 1
