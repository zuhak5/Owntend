name: Problem 007 branch helper

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.ref == 'fix/problem-7-points-counter-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and apply Problem 7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tool/.problem007_small_* | base64 -d > /tmp/problem_007_apply.py.gz
          echo 'ef35bd0f65f21875d69e13bf552c8a32109e41f1d5be0b28e17ea81facd3a435  /tmp/problem_007_apply.py.gz' | sha256sum -c -
          gzip -d -c /tmp/problem_007_apply.py.gz > tool/problem_007_apply.py
          echo '97cf57a95f62716068f16b230a20b06c9bc0b89073a2ff7009e23d5fed3f1e1e  tool/problem_007_apply.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path('tool/problem_007_apply.py')
          text = path.read_text()
          replace_needle = '    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one anchor, found {count}: {old[:120]!r}")\n'
          replace_guard = (
              '    if count == 0 and path in {\n'
              '        "lib/src/features/maintenance/application/task_creation_controller.dart",\n'
              '        "lib/src/features/monetization/charged_operation_resolver.dart",\n'
              '    }:\n'
              '        return\n' + replace_needle
          )
          if text.count(replace_needle) != 1:
              raise SystemExit('replace_once guard anchor mismatch')
          text = text.replace(replace_needle, replace_guard, 1)
          regex_needle = '    if count != 1:\n        raise RuntimeError(f"{path}: regex anchor failed: {pattern[:120]!r}")\n'
          regex_guard = (
              '    if count == 0 and path == "lib/src/features/monetization/charged_operation_resolver.dart":\n'
              '        return\n' + regex_needle
          )
          if text.count(regex_needle) != 1:
              raise SystemExit('regex_once guard anchor mismatch')
          path.write_text(text.replace(regex_needle, regex_guard, 1))
          PY
          python tool/problem_007_apply.py
          python - <<'PY'
          from pathlib import Path

          task_path = Path('lib/src/features/maintenance/application/task_creation_controller.dart')
          task = task_path.read_text()
          task_anchor = '        // CTC-006 & CTC-007: Reconcile canonical creation composite before\n'
          task_insert = (
              '        ref.read(pointWalletProvider.notifier).adoptAuthoritativeMutationResult(\n'
              '          result.balance,\n'
              '          userId: accountScope,\n'
              '        );\n\n' + task_anchor
          )
          if task.count(task_anchor) != 1:
              raise SystemExit('task authoritative balance anchor mismatch')
          task = task.replace(task_anchor, task_insert, 1)
          old_provider = '''  return ChargedOperationResolver(
            monetizationRepo: monetizationRepo,
            localSyncStore: localSyncStore,
            operationStore: ref.watch(taskCreationOperationStoreProvider),
          );'''
          new_provider = '''  return ChargedOperationResolver(
            monetizationRepo: monetizationRepo,
            localSyncStore: localSyncStore,
            operationStore: ref.watch(taskCreationOperationStoreProvider),
            adoptAuthoritativeBalance: (userId, balance) {
              ref
                  .read(pointWalletProvider.notifier)
                  .adoptAuthoritativeMutationResult(balance, userId: userId);
            },
          );'''
          if task.count(old_provider) != 1:
              raise SystemExit('charged resolver provider anchor mismatch')
          task_path.write_text(task.replace(old_provider, new_provider, 1))

          resolver_path = Path('lib/src/features/monetization/charged_operation_resolver.dart')
          resolver = resolver_path.read_text()
          old_ctor = '''  ChargedOperationResolver({
            required this.monetizationRepo,
            required this.localSyncStore,
            required this.operationStore,
          });'''
          new_ctor = '''  ChargedOperationResolver({
            required this.monetizationRepo,
            required this.localSyncStore,
            required this.operationStore,
            required void Function(String userId, int balance) adoptAuthoritativeBalance,
          }) : _adoptAuthoritativeBalance = adoptAuthoritativeBalance;'''
          if resolver.count(old_ctor) != 1:
              raise SystemExit('resolver constructor anchor mismatch')
          resolver = resolver.replace(old_ctor, new_ctor, 1)
          field_anchor = '  final TaskCreationOperationStore operationStore;\n'
          field_insert = field_anchor + '  final void Function(String userId, int balance) _adoptAuthoritativeBalance;\n'
          if resolver.count(field_anchor) != 1:
              raise SystemExit('resolver callback field anchor mismatch')
          resolver = resolver.replace(field_anchor, field_insert, 1)
          completed_anchor = '''            continue;
          }
          if (op.requestPayload.containsKey('plan') || status.plan != null) {'''
          completed_insert = '''            continue;
          }
          if (status.balance case final balance?) {
            _adoptAuthoritativeBalance(accountScope, balance);
            if (!_accountIsCurrent(accountScope)) return;
          }
          if (op.requestPayload.containsKey('plan') || status.plan != null) {'''
          if resolver.count(completed_anchor) != 1:
              raise SystemExit('completed recovery balance anchor mismatch')
          resolver = resolver.replace(completed_anchor, completed_insert, 1)
          task_replay = '''                if (!_accountIsCurrent(accountScope)) return;
                await localSyncStore.reconcileTaskCreationComposite('''
          task_replay_insert = '''                if (!_accountIsCurrent(accountScope)) return;
                _adoptAuthoritativeBalance(accountScope, result.balance);
                if (!_accountIsCurrent(accountScope)) return;
                await localSyncStore.reconcileTaskCreationComposite('''
          if resolver.count(task_replay) != 1:
              raise SystemExit('task replay balance anchor mismatch')
          resolver = resolver.replace(task_replay, task_replay_insert, 1)
          asset_replay = '''                if (!_accountIsCurrent(accountScope)) return;
                await localSyncStore.reconcileAssetCreationComposite('''
          asset_replay_insert = '''                if (!_accountIsCurrent(accountScope)) return;
                _adoptAuthoritativeBalance(accountScope, result.balance);
                if (!_accountIsCurrent(accountScope)) return;
                await localSyncStore.reconcileAssetCreationComposite('''
          if resolver.count(asset_replay) != 1:
              raise SystemExit('asset replay balance anchor mismatch')
          resolver_path.write_text(resolver.replace(asset_replay, asset_replay_insert, 1))
          PY
          rm -f tool/.problem007_payload_* tool/.problem007_gz_* tool/.problem007_small_* tool/.problem007_trigger tool/problem_007_apply.py
          rm -f .github/workflows/problem-007-helper.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate repository-owned sources
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Format touched Dart sources
        run: |
          dart format \
            lib/src/features/monetization/monetization.dart \
            lib/src/features/monetization/charged_operation_resolver.dart \
            lib/src/features/maintenance/application/task_creation_controller.dart \
            lib/src/features/assets/presentation/asset_dialogs.dart \
            test/charged_operation_journal_test.dart \
            test/problem_007_wallet_sync_test.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run focused Problem 7 regressions
        run: >-
          flutter test --no-pub --concurrency=1
          test/problem_007_wallet_sync_test.dart
          test/charged_operation_journal_test.dart
          test/monetization_test.dart
          test/task_creation_insufficient_points_test.dart
          test/bug_005_startup_recovery_wiring_test.dart
          test/bug_011_notification_completion_ack_test.dart

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add -A
          git commit -m 'fix: synchronize authoritative point wallet state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
