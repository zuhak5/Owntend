name: Problem 007 branch helper

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.ref == 'fix/problem-7-points-counter-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and apply Problem 7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tool/.problem007_small_* | base64 -d > /tmp/problem_007_apply.py.gz
          echo 'ef35bd0f65f21875d69e13bf552c8a32109e41f1d5be0b28e17ea81facd3a435  /tmp/problem_007_apply.py.gz' | sha256sum -c -
          gzip -d -c /tmp/problem_007_apply.py.gz > tool/problem_007_apply.py
          echo '97cf57a95f62716068f16b230a20b06c9bc0b89073a2ff7009e23d5fed3f1e1e  tool/problem_007_apply.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path('tool/problem_007_apply.py')
          text = path.read_text()
          replace_needle = '    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one anchor, found {count}: {old[:120]!r}")\n'
          replace_guard = (
              '    if count == 0 and path in {\n'
              '        "lib/src/features/maintenance/application/task_creation_controller.dart",\n'
              '        "lib/src/features/monetization/charged_operation_resolver.dart",\n'
              '    }:\n'
              '        return\n' + replace_needle
          )
          if text.count(replace_needle) != 1:
              raise SystemExit('replace_once guard anchor mismatch')
          text = text.replace(replace_needle, replace_guard, 1)
          regex_needle = '    if count != 1:\n        raise RuntimeError(f"{path}: regex anchor failed: {pattern[:120]!r}")\n'
          regex_guard = (
              '    if count == 0 and path == "lib/src/features/monetization/charged_operation_resolver.dart":\n'
              '        return\n' + regex_needle
          )
          if text.count(regex_needle) != 1:
              raise SystemExit('regex_once guard anchor mismatch')
          text = text.replace(regex_needle, regex_guard, 1)
          asset_start = text.index('text = read("lib/src/features/assets/presentation/asset_dialogs.dart")')
          asset_end_anchor = 'write("lib/src/features/assets/presentation/asset_dialogs.dart", text)'
          asset_end = text.index(asset_end_anchor, asset_start) + len(asset_end_anchor)
          text = text[:asset_start] + '# asset dialogs patched against current main by helper\n' + text[asset_end:]
          path.write_text(text)
          PY
          python tool/problem_007_apply.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              path.write_text(text.replace(old, new, 1))

          monetization_path = Path('lib/src/features/monetization/monetization.dart')
          owner_decl = (
              'final pointWalletProvider =\n'
              '    NotifierProvider<PointWalletController, AsyncValue<PointWallet?>>(\n'
              '      PointWalletController.new,\n'
              '    );'
          )
          owner_and_view = (
              'final pointWalletControllerProvider =\n'
              '    NotifierProvider<PointWalletController, AsyncValue<PointWallet?>>(\n'
              '      PointWalletController.new,\n'
              '    );\n\n'
              '/// Read-only wallet view kept as the stable presentation/test seam.\n'
              '/// State is owned only by [pointWalletControllerProvider].\n'
              'final pointWalletProvider = Provider<AsyncValue<PointWallet?>>((ref) {\n'
              '  return ref.watch(pointWalletControllerProvider);\n'
              '});'
          )
          replace_once(monetization_path, owner_decl, owner_and_view, 'wallet owner/view provider split')
          text = monetization_path.read_text().replace(
              'pointWalletProvider.notifier',
              'pointWalletControllerProvider.notifier',
          )
          monetization_path.write_text(text)

          task_path = Path('lib/src/features/maintenance/application/task_creation_controller.dart')
          task_anchor = '        // CTC-006 & CTC-007: Reconcile canonical creation composite before\n'
          task_insert = (
              '        ref.read(pointWalletControllerProvider.notifier).adoptAuthoritativeMutationResult(\n'
              '          result.balance,\n'
              '          userId: accountScope,\n'
              '        );\n\n' + task_anchor
          )
          replace_once(task_path, task_anchor, task_insert, 'task balance adoption')

          old_provider = (
              '  return ChargedOperationResolver(\n'
              '    monetizationRepo: monetizationRepo,\n'
              '    localSyncStore: localSyncStore,\n'
              '    operationStore: ref.watch(taskCreationOperationStoreProvider),\n'
              '  );'
          )
          new_provider = (
              '  return ChargedOperationResolver(\n'
              '    monetizationRepo: monetizationRepo,\n'
              '    localSyncStore: localSyncStore,\n'
              '    operationStore: ref.watch(taskCreationOperationStoreProvider),\n'
              '    adoptAuthoritativeBalance: (userId, balance) {\n'
              '      ref\n'
              '          .read(pointWalletControllerProvider.notifier)\n'
              '          .adoptAuthoritativeMutationResult(balance, userId: userId);\n'
              '    },\n'
              '  );'
          )
          replace_once(task_path, old_provider, new_provider, 'resolver provider callback')

          resolver_path = Path('lib/src/features/monetization/charged_operation_resolver.dart')
          old_ctor = (
              '  ChargedOperationResolver({\n'
              '    required this.monetizationRepo,\n'
              '    required this.localSyncStore,\n'
              '    required this.operationStore,\n'
              '  });'
          )
          new_ctor = (
              '  ChargedOperationResolver({\n'
              '    required this.monetizationRepo,\n'
              '    required this.localSyncStore,\n'
              '    required this.operationStore,\n'
              '    required void Function(String userId, int balance) adoptAuthoritativeBalance,\n'
              '  }) : _adoptAuthoritativeBalance =\n'
              '           ((userId, balance) => adoptAuthoritativeBalance(userId, balance));'
          )
          replace_once(resolver_path, old_ctor, new_ctor, 'resolver constructor')
          field_anchor = '  final TaskCreationOperationStore operationStore;\n'
          field_insert = field_anchor + '  final void Function(String userId, int balance) _adoptAuthoritativeBalance;\n'
          replace_once(resolver_path, field_anchor, field_insert, 'resolver callback field')

          completed_anchor = (
              '            continue;\n'
              '          }\n'
              "          if (op.requestPayload.containsKey('plan') || status.plan != null) {"
          )
          completed_insert = (
              '            continue;\n'
              '          }\n'
              '          if (status.balance case final balance?) {\n'
              '            _adoptAuthoritativeBalance(accountScope, balance);\n'
              '            if (!_accountIsCurrent(accountScope)) return;\n'
              '          }\n'
              "          if (op.requestPayload.containsKey('plan') || status.plan != null) {"
          )
          replace_once(resolver_path, completed_anchor, completed_insert, 'completed recovery balance')

          task_replay = (
              '                final result = await monetizationRepo.createTask(\n'
              '                  op.requestPayload,\n'
              '                );\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                await localSyncStore.reconcileTaskCreationComposite('
          )
          task_replay_insert = (
              '                final result = await monetizationRepo.createTask(\n'
              '                  op.requestPayload,\n'
              '                );\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                _adoptAuthoritativeBalance(accountScope, result.balance);\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                await localSyncStore.reconcileTaskCreationComposite('
          )
          replace_once(resolver_path, task_replay, task_replay_insert, 'task replay balance')

          asset_replay = (
              '                final result = await monetizationRepo.createAsset(\n'
              '                  op.requestPayload,\n'
              '                );\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                await localSyncStore.reconcileAssetCreationComposite('
          )
          asset_replay_insert = (
              '                final result = await monetizationRepo.createAsset(\n'
              '                  op.requestPayload,\n'
              '                );\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                _adoptAuthoritativeBalance(accountScope, result.balance);\n'
              '                if (!_accountIsCurrent(accountScope)) return;\n'
              '                await localSyncStore.reconcileAssetCreationComposite('
          )
          replace_once(resolver_path, asset_replay, asset_replay_insert, 'asset replay balance')

          asset_path = Path('lib/src/features/assets/presentation/asset_dialogs.dart')
          copy_rpc = '              final debit = await monetization.createAsset({\n'
          copy_rpc_new = (
              '              final walletUserId = monetization.currentUserId;\n'
              '              final debit = await monetization.createAsset({\n'
          )
          replace_once(asset_path, copy_rpc, copy_rpc_new, 'copy wallet identity capture')
          copy_after = (
              '              });\n'
              '              if (debit.charged == 1) {'
          )
          copy_after_new = (
              '              });\n'
              '              if (walletUserId != null) {\n'
              '                ref\n'
              '                    .read(pointWalletControllerProvider.notifier)\n'
              '                    .adoptAuthoritativeMutationResult(\n'
              '                      debit.balance,\n'
              '                      userId: walletUserId,\n'
              '                    );\n'
              '              }\n'
              '              if (debit.charged == 1) {'
          )
          replace_once(asset_path, copy_after, copy_after_new, 'copy balance adoption')
          create_rpc = '        debitResult = await monetization.createAsset({\n'
          create_rpc_new = (
              '        final walletUserId = monetization.currentUserId;\n'
              '        final debit = await monetization.createAsset({\n'
          )
          replace_once(asset_path, create_rpc, create_rpc_new, 'create wallet identity capture')
          create_after = (
              '          \'initial_plans\': const <Map<String, dynamic>>[],\n'
              '        });\n'
              '      }'
          )
          create_after_new = (
              '          \'initial_plans\': const <Map<String, dynamic>>[],\n'
              '        });\n'
              '        debitResult = debit;\n'
              '        if (walletUserId != null) {\n'
              '          ref\n'
              '              .read(pointWalletControllerProvider.notifier)\n'
              '              .adoptAuthoritativeMutationResult(\n'
              '                debit.balance,\n'
              '                userId: walletUserId,\n'
              '              );\n'
              '        }\n'
              '      }'
          )
          replace_once(asset_path, create_after, create_after_new, 'create balance adoption')

          wallet_test = Path('test/problem_007_wallet_sync_test.dart')
          test_text = wallet_test.read_text().replace(
              'pointWalletProvider.notifier',
              'pointWalletControllerProvider.notifier',
          )
          test_text = test_text.replace("    this.userId = 'user-a',\n", '')
          test_text = test_text.replace('  String? userId;\n', "  String? userId = 'user-a';\n", 1)
          wallet_test.write_text(test_text)
          PY
          rm -f tool/.problem007_payload_* tool/.problem007_gz_* tool/.problem007_small_* tool/.problem007_trigger tool/problem_007_apply.py
          rm -f .github/workflows/problem-007-helper.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate repository-owned sources
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Format touched Dart sources
        run: |
          dart format \
            lib/src/features/monetization/monetization.dart \
            lib/src/features/monetization/charged_operation_resolver.dart \
            lib/src/features/maintenance/application/task_creation_controller.dart \
            lib/src/features/assets/presentation/asset_dialogs.dart \
            test/charged_operation_journal_test.dart \
            test/problem_007_wallet_sync_test.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run focused Problem 7 regressions
        run: >-
          flutter test --no-pub --concurrency=1
          test/problem_007_wallet_sync_test.dart
          test/charged_operation_journal_test.dart
          test/monetization_test.dart
          test/task_creation_insufficient_points_test.dart
          test/bug_005_startup_recovery_wiring_test.dart
          test/bug_011_notification_completion_ack_test.dart

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add -A
          git commit -m 'fix: synchronize authoritative point wallet state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
