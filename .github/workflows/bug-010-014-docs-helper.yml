name: BUG-010-014 Docs Helper

on:
  push:
    branches:
      - fix/bug-010-bug-014-notification-consumers
    paths:
      - .github/workflows/bug-010-014-docs-helper.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation updates
        run: python3 tool/bug_010_014_docs_helper.py
      - name: Commit documentation updates
        shell: bash
        run: |
          set -euo pipefail
          git add PRIVACY.md docs/architecture/system-overview.md docs/reference/routes-and-permissions.md docs/development/testing.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document BUG-010 and BUG-014 notification execution"
          git push origin HEAD:fix/bug-010-bug-014-notification-consumers
