name: Validate Google Backend and Release Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: owntend-google-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-security:
    name: Deno SSV tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.3"
      - name: Verify Deno formatting
        run: >-
          deno fmt --check
          supabase/functions/admob-ssv-handler/index.ts
          supabase/functions/admob-ssv-handler/index_test.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/delete-account/index_test.ts
          supabase/functions/account-deletion-status/index.ts
          supabase/functions/account-deletion-status/index_test.ts
      - name: Type-check locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno install --frozen && cd ../../..
          cd supabase/functions/delete-account && deno install --frozen && cd ../../..
          cd supabase/functions/account-deletion-status && deno install --frozen && cd ../../..
          cd supabase/functions/admob-ssv-handler && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/delete-account && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno check --frozen index.ts && cd ../../..
      - name: Test locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno test --frozen --allow-env --allow-net index_test.ts

  web-and-static-contracts:
    name: Google contract/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate test inventory and execute all canonical Node tests
        run: |
          npm run validate:test-inventory
          npm run validate:asset-provenance
          npm run test:all
      - name: Validate Google and Android contracts
        run: node tool/validate_google_release_contracts.mjs

  database-security:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Lint database schema
        run: npm run supabase:lint
      - name: Run database authorization and monetization tests
        run: npm run supabase:test
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  hosted-advisors:
    name: Hosted Supabase Advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Query hosted security and performance advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14

  purge-stale-actions-runs:
    name: Purge stale Actions runs from repository registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Purge stale Actions runs through repository run registry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete runs belonging to workflow records absent from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          canonical_paths=$(cat <<'EOF'
          .github/workflows/audit-supabase-advisors.yml
          .github/workflows/build-play-android.yml
          .github/workflows/build-production-android.yml
          .github/workflows/deploy-download-site.yml
          .github/workflows/deploy-supabase-migrations.yml
          .github/workflows/validate-flutter.yml
          .github/workflows/validate-google-backend.yml
          EOF
          )

          curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" > /tmp/workflows.json
          : > /tmp/stale-workflow-ids
          echo "Workflow registry before purge:"
          jq -r '.workflows[] | [.id, .state, .path, .name] | @tsv' /tmp/workflows.json
          while IFS=$'\t' read -r workflow_id workflow_path; do
            if ! printf '%s\n' "$canonical_paths" | grep -Fxq "$workflow_path"; then
              echo "$workflow_id" >> /tmp/stale-workflow-ids
            fi
          done < <(jq -r '.workflows[] | [.id, .path] | @tsv' /tmp/workflows.json)

          sort -u /tmp/stale-workflow-ids -o /tmp/stale-workflow-ids
          echo "Stale workflow IDs:"
          cat /tmp/stale-workflow-ids || true

          pass=0
          while :; do
            pass=$((pass + 1))
            : > /tmp/stale-run-ids
            page=1
            while :; do
              payload="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100&page=$page")"
              count="$(jq '.workflow_runs | length' <<< "$payload")"
              while IFS=$'\t' read -r run_id workflow_id; do
                if grep -Fxq "$workflow_id" /tmp/stale-workflow-ids; then
                  echo "$run_id" >> /tmp/stale-run-ids
                fi
              done < <(jq -r '.workflow_runs[] | [.id, .workflow_id] | @tsv' <<< "$payload")
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done

            sort -u /tmp/stale-run-ids -o /tmp/stale-run-ids
            if [ ! -s /tmp/stale-run-ids ]; then
              echo "No stale workflow runs remain after pass $pass."
              break
            fi

            echo "Deleting $(wc -l < /tmp/stale-run-ids) stale runs on pass $pass..."
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              code="$(curl --silent --show-error -o /tmp/delete-response -w '%{http_code}' -X DELETE "${auth[@]}" "$api/actions/runs/$run_id")"
              if [ "$code" = "204" ]; then
                echo "Deleted run $run_id"
              elif [ "$code" = "409" ]; then
                echo "Cancelling active stale run $run_id before deletion"
                curl --silent --show-error -X POST "${auth[@]}" "$api/actions/runs/$run_id/cancel" >/dev/null || true
              else
                echo "Delete run $run_id returned HTTP $code"
                cat /tmp/delete-response || true
              fi
            done < /tmp/stale-run-ids

            [ "$pass" -ge 8 ] && { echo "Stale runs remain after 8 passes"; exit 1; }
            sleep 2
          done

          echo "Workflow registry after stale-run purge:"
          curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" | jq -r '.workflows[] | [.id, .state, .path, .name] | @tsv'
