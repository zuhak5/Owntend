name: Validate Google Backend and Release Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: owntend-google-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-security:
    name: Deno SSV tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.3"
      - name: Verify Deno formatting
        run: >-
          deno fmt --check
          supabase/functions/_shared/request.ts
          supabase/functions/_shared/sentry.ts
          supabase/functions/_shared/sentry_test.ts
          supabase/functions/admob-ssv-handler/index.ts
          supabase/functions/admob-ssv-handler/index_test.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/delete-account/index_test.ts
          supabase/functions/account-deletion-status/index.ts
          supabase/functions/account-deletion-status/index_test.ts
          supabase/functions/process-media-cleanup/index.ts
          supabase/functions/process-media-cleanup/index_test.ts
      - name: Type-check locked Edge Functions
        run: |
          deno install --frozen --config deno.json
          cd supabase/functions/admob-ssv-handler && deno install --frozen && cd ../../..
          cd supabase/functions/delete-account && deno install --frozen && cd ../../..
          cd supabase/functions/account-deletion-status && deno install --frozen && cd ../../..
          cd supabase/functions/process-media-cleanup && deno install --frozen && cd ../../..
          cd supabase/functions/admob-ssv-handler && deno check --frozen index.ts index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno check --frozen index.ts index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno check --frozen index.ts index_test.ts && cd ../../..
          cd supabase/functions/process-media-cleanup && deno check --frozen index.ts index_test.ts && cd ../../..
      - name: Test locked Edge Functions
        run: |
          deno test --frozen --allow-env --allow-net --config deno.json supabase/functions/_shared/sentry_test.ts
          cd supabase/functions/admob-ssv-handler && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/process-media-cleanup && deno test --frozen --allow-env --allow-net index_test.ts && cd ../..

  web-and-static-contracts:
    name: Google contract/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate test inventory and execute all canonical Node tests
        run: |
          node --check tool/run_local_backend_integration.mjs
          npm run validate:test-inventory
          npm run validate:asset-provenance
          npm run test:all
      - name: Validate Google and Android contracts
        run: node tool/validate_google_release_contracts.mjs

  database-and-endpoint-integration:
    name: Blank-baseline database and Edge endpoint integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.3"
      - run: npm ci
      - name: Run isolated database and endpoint integration lane
        shell: pwsh
        run: npm run test:backend-integration

  application-backend-integration:
    name: Two-user application/backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: npm ci
      - run: flutter pub get --enforce-lockfile
      - name: Start the disposable local backend
        run: npx supabase start
      - name: Run real Auth, RLS, sync, and Storage scenarios
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          flutter test --no-pub --concurrency=1 --timeout 3m \
            test/backend_integration/local_backend_sync_test.dart \
            "--dart-define=OWNTEND_TEST_SUPABASE_URL=$API_URL" \
            "--dart-define=OWNTEND_TEST_SUPABASE_ANON_KEY=$ANON_KEY" \
            "--dart-define=OWNTEND_TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  hosted-advisors:
    name: Hosted Supabase Advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Query hosted security and performance advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14
