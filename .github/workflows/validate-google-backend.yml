name: Validate Google Backend and Release Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: owntend-google-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-security:
    name: Deno SSV tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.3"
      - name: Verify Deno formatting
        run: >-
          deno fmt --check
          supabase/functions/admob-ssv-handler/index.ts
          supabase/functions/admob-ssv-handler/index_test.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/delete-account/index_test.ts
          supabase/functions/account-deletion-status/index.ts
          supabase/functions/account-deletion-status/index_test.ts
      - name: Type-check locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno install --frozen && cd ../../..
          cd supabase/functions/delete-account && deno install --frozen && cd ../../..
          cd supabase/functions/account-deletion-status && deno install --frozen && cd ../../..
          cd supabase/functions/admob-ssv-handler && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/delete-account && deno check --frozen index.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno check --frozen index.ts && cd ../../..
      - name: Test locked Edge Functions
        run: |
          cd supabase/functions/admob-ssv-handler && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/delete-account && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..
          cd supabase/functions/account-deletion-status && deno test --frozen --allow-env --allow-net index_test.ts && cd ../../..

  web-and-static-contracts:
    name: Google contract/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate test inventory and execute all canonical Node tests
        run: |
          npm run validate:test-inventory
          npm run validate:asset-provenance
          npm run test:all
      - name: Validate Google and Android contracts
        run: node tool/validate_google_release_contracts.mjs

  database-security:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Lint database schema
        run: npm run supabase:lint
      - name: Run database authorization and monetization tests
        run: npm run supabase:test
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  validate-advisor-source:
    name: Require current main Advisor source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject a non-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require selected SHA to equal current origin/main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"
          test "${#source_sha}" -eq 40
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  hosted-advisors:
    name: Hosted Supabase Advisors
    if: github.event_name == 'workflow_dispatch'
    needs: validate-advisor-source
    runs-on: ubuntu-latest
    environment: production-supabase-advisors
    timeout-minutes: 10
    steps:
      - name: Check out validated Advisor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate-advisor-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact current main after approval
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-advisor-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$source_sha" = "$GITHUB_SHA"
          test "$source_sha" = "$remote_sha"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Query hosted security and performance advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADVISOR_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ADVISOR_REPORT: artifacts/supabase-advisors.json
        run: node tool/audit_supabase_advisors.mjs

      - name: Upload sanitized advisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-advisors-${{ needs.validate-advisor-source.outputs.source_sha }}
          path: artifacts/supabase-advisors.json
          if-no-files-found: error
          retention-days: 14

  purge-stale-actions-workflows:
    name: Purge stale Actions workflows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Purge stale Actions workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete stale workflow runs and disable stale workflow records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          canonical_paths=$(cat <<'EOF'
          .github/workflows/audit-supabase-advisors.yml
          .github/workflows/build-play-android.yml
          .github/workflows/build-production-android.yml
          .github/workflows/deploy-download-site.yml
          .github/workflows/deploy-supabase-migrations.yml
          .github/workflows/validate-flutter.yml
          .github/workflows/validate-google-backend.yml
          EOF
          )

          echo 'Workflow records before cleanup:'
          curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" \
            | jq -r '.workflows[] | [.id, .name, .path, .state] | @tsv'

          while IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state; do
            if printf '%s\n' "$canonical_paths" | grep -Fxq "$workflow_path"; then
              continue
            fi

            echo "Purging stale workflow: id=$workflow_id name=$workflow_name path=$workflow_path state=$workflow_state"
            while :; do
              run_ids="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows/$workflow_id/runs?per_page=100" | jq -r '.workflow_runs[].id')"
              [ -z "$run_ids" ] && break
              while IFS= read -r run_id; do
                [ -z "$run_id" ] && continue
                echo "Deleting run $run_id"
                curl --fail-with-body --silent --show-error -X DELETE "${auth[@]}" "$api/actions/runs/$run_id"
              done <<< "$run_ids"
            done

            curl --fail-with-body --silent --show-error -X PUT "${auth[@]}" "$api/actions/workflows/$workflow_id/disable" >/dev/null
            remaining="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows/$workflow_id/runs?per_page=1" | jq '.total_count')"
            test "$remaining" -eq 0
          done < <(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" | jq -r '.workflows[] | [.id, .name, .path, .state] | @tsv')

          echo 'Workflow records after cleanup:'
          curl --fail-with-body --silent --show-error "${auth[@]}" "$api/actions/workflows?per_page=100" \
            | jq -r '.workflows[] | [.id, .name, .path, .state] | @tsv'
