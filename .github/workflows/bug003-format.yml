name: Apply BUG-003 CI formatting

on:
  push:
    branches:
      - fix/bug-003-durable-restore-recovery

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Apply BUG-003 CI formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/bug-003-durable-restore-recovery
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format test/backup_service_test.dart test/restore_journal_test.dart
      - name: Remove temporary formatter workflow
        run: git rm .github/workflows/bug003-format.yml
      - name: Verify diff cleanliness
        run: git diff --check
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          git commit -m "Format BUG-003 tests"
          git push origin HEAD:fix/bug-003-durable-restore-recovery
