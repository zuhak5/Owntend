name: Verify Production APK Artifact Set

on:
  workflow_run:
    workflows:
      - Shorebird Android Release
    types:
      - completed

permissions:
  contents: write
  actions: read
  attestations: read

jobs:
  discover-production-artifact:
    name: Discover published production APK set
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      should_verify: ${{ steps.artifact.outputs.should_verify }}
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Discover exact production publish artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="Owntend-production-shorebird-apk-evidence-$SOURCE_RUN_NUMBER"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false)] | length")"
          if [[ "$count" == "1" ]]; then
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "should_verify=true" >> "$GITHUB_OUTPUT"
          elif [[ "$count" == "0" ]]; then
            echo "should_verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "Expected zero or one exact production artifact, found $count." >&2
            exit 1
          fi

  verify-production-apk-artifact-set:
    name: Verify ABI APK artifact set
    needs: discover-production-artifact
    if: ${{ needs.discover-production-artifact.outputs.should_verify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

    steps:
      - name: Check out exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require triggering source to remain current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          test "$checked_out_sha" = "$SOURCE_SHA"
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "ABI artifact-set verification requires exact current main $main_sha, got $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version_value="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [[ ! "$version_value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Expected pubspec version x.y.z+build, got: $version_value" >&2
            exit 1
          fi
          echo "version_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version_code=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Restore protected ABI APK evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="${{ needs.discover-production-artifact.outputs.artifact_name }}"
          rm -rf restored-apk-evidence
          mkdir -p restored-apk-evidence
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir restored-apk-evidence
          index_path="$(find restored-apk-evidence -type f -name abi-evidence-index.json -print -quit)"
          test -n "$index_path"
          echo "EVIDENCE_ROOT=$(dirname "$index_path")" >> "$GITHUB_ENV"

      - name: Verify strict ABI artifact set and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version_name }}
          EXPECTED_BUILD: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release
          node tool/verify_android_apk_artifact_set.mjs \
            --root "$EVIDENCE_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --version-name "$EXPECTED_VERSION" \
            --version-code "$EXPECTED_BUILD" \
            --output release/apk-artifact-set-verification.json

      - name: Upload verified ABI artifact-set evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Owntend-production-apk-artifact-set-verification-${{ github.event.workflow_run.run_number }}
          path: release/apk-artifact-set-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified production APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.release.outputs.version_name }}-build.${{ steps.release.outputs.version_code }}
          RELEASE_TITLE: Owntend ${{ steps.release.outputs.version_name }} (Build ${{ steps.release.outputs.version_code }})
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes
          fi
          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-arm64-v8a.apk" \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-arm64-v8a.apk.sha256" \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-armeabi-v7a.apk" \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-armeabi-v7a.apk.sha256" \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-x86_64.apk" \
            "$EVIDENCE_ROOT/artifacts/Owntend-${{ steps.release.outputs.version_name }}-build-${{ steps.release.outputs.version_code }}-x86_64.apk.sha256"
