name: Apply VersionDeck live-status runtime fix

on:
  push:
    branches:
      - agent/fix-versiondeck-live-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/fix-versiondeck-live-runtime
          fetch-depth: 0

      - name: Apply surgical runtime fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('download-site/build-status.js')
          source = source_path.read_text(encoding='utf-8')
          count = source.count('fetchRunJob(')
          if count != 3:
              raise SystemExit(f'Expected exactly 3 stale fetchRunJob calls, found {count}.')
          source = source.replace('fetchRunJob(', 'fetchLiveBuildRunJobs(')
          if 'fetchRunJob(' in source:
              raise SystemExit('A stale fetchRunJob call remains.')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tool/build-status.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'live polling calls the exported production-job fetcher'
          if test_name not in tests:
              tests += '''\n\ntest("live polling calls the exported production-job fetcher", async () => {\n  const { readFile } = await import("node:fs/promises");\n  const source = await readFile(\n    new URL("../download-site/build-status.js", import.meta.url),\n    "utf8",\n  );\n  assert.doesNotMatch(source, /\\bfetchRunJob\\s*\\(/);\n  assert.match(source, /fetchLiveBuildRunJobs\\(currentRun\\.id/);\n  assert.match(source, /fetchLiveBuildRunJobs\\(activeRun\\.id/);\n});\n'''
              test_path.write_text(tests, encoding='utf-8')
          PY

          node --check download-site/build-status.js
          node --test tool/build-status.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-site/build-status.js tool/build-status.test.mjs
          git diff --cached --check
          git commit -m "Fix VersionDeck live build polling"
          git push origin HEAD:agent/fix-versiondeck-live-runtime
