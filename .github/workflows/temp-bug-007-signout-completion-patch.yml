name: Temporary BUG-007 sign-out completion patch

on:
  push:
    branches:
      - fix/bug-002-bug-007-account-safety

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-002-bug-007-account-safety
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      - name: Apply scoped sign-out completion edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sync_path = Path('lib/src/core/sync/sync_coordinator.dart')
          sync = sync_path.read_text()
          anchor = '  Future<void> cancelAccountDeletion(String userId) {'
          if anchor not in sync:
            raise SystemExit('sync completion anchor not found')
          completion = """  Future<void> completeAccountSignOut(String userId) {
            return _serializeAccountTransition(() async {
              if (_deletingUserId != null && _deletingUserId != userId) {
                throw StateError(
                  'Sign-out completion does not match the active account transition.',
                );
              }
              _accountDeletionInProgress = false;
              _deletingUserId = null;
              _advanceAccountEpoch('account_sign_out_completed');
              _cancelScheduledSyncWork();
              _deferredRemoteMedia.clear();
              _mergeConfirmationRequired = false;
              _phaseOverride = SyncPhase.signedOut;
              _messageOverride = null;
              await _stopRealtime();
              await _emit();
            });
          }

          """
          sync = sync.replace(anchor, completion + anchor, 1)
          sync_path.write_text(sync)

          startup_path = Path(
              'lib/src/features/startup/presentation/startup_bootstrap.dart'
          )
          startup = startup_path.read_text()
          old = """              accountDeletionCancelProvider.overrideWith(
                (ref) => (userId) async {
                  await ref
                      .read(syncCoordinatorProvider)
                      ?.cancelAccountDeletion(userId);
                  await ref
                      .read(notificationSchedulerProvider)
                      .refreshSchedules();
                },
              ),
          """
          new = """              accountDeletionCancelProvider.overrideWith(
                (ref) => (userId) async {
                  final coordinator = ref.read(syncCoordinatorProvider);
                  final session = ref.read(authRepositoryProvider)?.currentSession;
                  if (session == null) {
                    await coordinator?.completeAccountSignOut(userId);
                    await cancelAccountScopedBackgroundWork();
                    return;
                  }
                  await coordinator?.cancelAccountDeletion(userId);
                  await ref
                      .read(notificationSchedulerProvider)
                      .refreshSchedules();
                },
              ),
          """
          if old not in startup:
            raise SystemExit('startup cancel provider anchor not found')
          startup = startup.replace(old, new, 1)
          startup_path.write_text(startup)
          PY

          dart format lib/src/core/sync/sync_coordinator.dart lib/src/features/startup/presentation/startup_bootstrap.dart
          rm .github/workflows/temp-bug-007-signout-completion-patch.yml

      - name: Commit scoped edit and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/core/sync/sync_coordinator.dart lib/src/features/startup/presentation/startup_bootstrap.dart .github/workflows/temp-bug-007-signout-completion-patch.yml
          git diff --cached --check
          git commit -m "Keep successful sign-out quiesced"
          git push origin HEAD:fix/bug-002-bug-007-account-safety
