name: Apply and Validate BUG-001 BUG-006

on:
  push:
    branches:
      - fix/bug-001-bug-006-sync-atomicity

permissions:
  contents: write

concurrency:
  group: remediation-bug-001-006
  cancel-in-progress: true

jobs:
  remediate:
    name: Patch, focused tests, full Flutter validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/bug-001-bug-006-sync-atomicity
          fetch-depth: 0

      - name: Apply scoped remediation patch
        run: python tool/apply_bug_001_006_remediation.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate source files
        run: dart run build_runner build

      - name: Format changed Dart sources
        run: >-
          dart format
          lib/src/core/sync/local_sync_store.dart
          lib/src/core/sync/sync_coordinator.dart
          test/sync_store_test.dart
          test/client_pull_cursors_and_healing_test.dart

      - name: Run focused sync regression tests
        run: >-
          flutter test
          --no-pub
          --concurrency=1
          --timeout 3m
          test/client_pull_cursors_and_healing_test.dart
          test/sync_store_test.dart
          test/sync_coordinator_test.dart

      - name: Verify repository Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run complete Flutter test suite
        run: >-
          flutter test
          --no-pub
          --concurrency=1
          --timeout 3m
          --exclude-tags production-config

      - name: Validate production configuration schema
        run: >-
          flutter test
          --no-pub
          test/prod_build_config_test.dart
          --dart-define-from-file=config/prod.example.json
          --dart-define=VERIFY_PRODUCTION_CONFIG=true

      - name: Verify remediation worktree scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "lib/src/core/sync/local_sync_store.dart",
            "lib/src/core/sync/sync_coordinator.dart",
            "test/sync_store_test.dart",
            "test/client_pull_cursors_and_healing_test.dart",
            "docs/architecture/sync-protocol.md",
            "CHANGELOG.md"
          )
          $changed = @(git diff --name-only HEAD)
          if ($changed.Count -ne $expected.Count) {
            throw "Expected exactly $($expected.Count) remediation paths; found $($changed.Count): $($changed -join ', ')"
          }
          foreach ($path in $changed) {
            if ($expected -notcontains $path) {
              throw "Unexpected generated or unrelated change: $path"
            }
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              throw "Expected remediation path is unchanged: $path"
            }
          }
          git diff --check

      - name: Commit validated remediation and remove temporary runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "f3ceb2358e2812d806deb6215b31560136f5f711"
          $expected = @(
            "lib/src/core/sync/local_sync_store.dart",
            "lib/src/core/sync/sync_coordinator.dart",
            "test/sync_store_test.dart",
            "test/client_pull_cursors_and_healing_test.dart",
            "docs/architecture/sync-protocol.md",
            "CHANGELOG.md"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/apply_bug_001_006_remediation.py
          git rm .github/workflows/remediation-bug-001-006.yml
          git add -- $expected
          $final = @(git diff --cached --name-only $base)
          if ($final.Count -ne $expected.Count) {
            throw "Prospective PR must contain exactly $($expected.Count) paths; found $($final.Count): $($final -join ', ')"
          }
          foreach ($path in $final) {
            if ($expected -notcontains $path) {
              throw "Unexpected final PR path: $path"
            }
          }
          foreach ($path in $expected) {
            if ($final -notcontains $path) {
              throw "Expected final PR path is missing: $path"
            }
          }
          git diff --cached --check $base
          git commit -m "fix BUG-001 BUG-006 sync checkpoint atomicity"
          git push origin HEAD:fix/bug-001-bug-006-sync-atomicity
